name: Migrate all GDP confirmations

on:
  push:
    paths:
      - ".github/workflows/migrate-all-confirmations.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply system-wide confirmation migration
        run: node scripts/migrate-all-confirmations.mjs

      - name: Verify native confirms are gone
        shell: bash
        run: |
          if grep -RInE 'window\.confirm[[:space:]]*\(' src --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx'; then
            echo "Native window.confirm calls remain in src/."
            exit 1
          fi
          echo "No native window.confirm calls found."

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit migrated UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Migrate remaining native confirmations to GDP UI"
          git push
