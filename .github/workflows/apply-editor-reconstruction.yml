name: Apply GDP editor reconstruction

on:
  push:
    branches:
      - feat/editor-reconstruction-sept10

permissions:
  contents: write

jobs:
  reconstruct-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-reconstruction-sept10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted editor refinements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          seasonal = "src/components/storefront/SeasonalStudio.jsx"

          replace_once(
              seasonal,
              "import { AlertTriangle, Check, ChevronDown, Edit3, Maximize2, Move, RotateCcw, RotateCw, Ruler, Search, Shirt, ShoppingBag, Sparkles, Trash2, X } from 'lucide-react';",
              "import { AlertTriangle, Check, ChevronDown, Edit3, Maximize2, Move, RotateCcw, Ruler, Search, Shirt, ShoppingBag, Sparkles, Trash2, X, ZoomIn, ZoomOut } from 'lucide-react';",
              "seasonal icon imports",
          )

          replace_once(
              seasonal,
              "export function SeasonalOverlay({ artwork, layout, area, text, rotation = 0, editable = false, showSelection = true, onMove = undefined, onResize = undefined, onRotate = undefined, onDelete = undefined }) {",
              "export function SeasonalOverlay({ artwork, layout, area, text, rotation = 0, editable = false, showSelection = true, onMove = undefined, onResize = undefined, onRotate = undefined }) {",
              "seasonal overlay signature",
          )

          old_chrome = '''      {editable && showSelection && (\n        <>\n          <div className="pointer-events-none absolute left-1/2 top-[-31px] -translate-x-1/2 whitespace-nowrap rounded-full border border-white/15 bg-[#07131F]/95 px-2.5 py-1 text-[7px] font-bold uppercase tracking-[.09em] text-white shadow-lg backdrop-blur">Artwork · drag · pinch · twist</div>\n          <button data-control type="button" onClick={(event) => { event.stopPropagation(); onDelete?.(); }} className="absolute -right-3 -top-3 z-20 grid h-7 w-7 place-items-center rounded-full border-2 border-white bg-[#07131F] text-white shadow-lg" aria-label="Remove artwork"><X size={12} /></button>\n          <button data-control type="button" onPointerDown={(event) => beginHandle(event, 'rotate')} onPointerMove={move} onPointerUp={stop} onPointerCancel={stop} className="absolute -left-3 -top-3 z-20 grid h-7 w-7 touch-none place-items-center rounded-full border-2 border-white bg-[#07131F] text-white shadow-lg" aria-label="Rotate artwork"><RotateCw size={12} /></button>\n          <button data-control type="button" onPointerDown={(event) => beginHandle(event, 'resize')} onPointerMove={move} onPointerUp={stop} onPointerCancel={stop} className="absolute -bottom-3 -right-3 z-20 grid h-7 w-7 touch-none place-items-center rounded-full border-2 border-white bg-[#D9273E] text-white shadow-lg" aria-label="Resize artwork"><Maximize2 size={12} /></button>\n        </>\n      )}'''
          new_chrome = '''      {editable && showSelection && (\n        <button data-control type="button" onPointerDown={(event) => beginHandle(event, 'resize')} onPointerMove={move} onPointerUp={stop} onPointerCancel={stop} className="absolute -bottom-3 -right-3 z-20 grid h-8 w-8 touch-none place-items-center rounded-full border-2 border-white bg-[#D9273E] text-white shadow-[0_5px_16px_rgba(0,0,0,.22)]" aria-label="Resize artwork"><Maximize2 size={13} /></button>\n      )}'''
          replace_once(seasonal, old_chrome, new_chrome, "seasonal selection chrome")

          replace_once(
              seasonal,
              "  const [showMeasurements, setShowMeasurements] = useState(false);\n  const [reviewMode, setReviewMode] = useState(false);",
              "  const [showMeasurements, setShowMeasurements] = useState(false);\n  const [previewZoom, setPreviewZoom] = useState(1.18);\n  const [reviewMode, setReviewMode] = useState(false);",
              "seasonal preview zoom state",
          )

          old_toolbar = '''                  <div className="flex gap-1.5">\n                    <button type="button" aria-pressed={showGuides} onClick={() => setShowGuides((value) => !value)} className={`inline-flex min-h-10 items-center gap-1.5 rounded-xl border px-3 py-2 text-[11px] font-bold ${showGuides ? 'border-[#17324D] bg-[#17324D] text-white' : 'border-[#DCE3EA] bg-white text-[#607080]'}`}><Maximize2 size={14} /> Print area {showGuides ? 'on' : 'off'}</button>\n                    <button type="button" aria-pressed={showMeasurements} onClick={() => setShowMeasurements((value) => !value)} className={`inline-flex min-h-10 items-center gap-1.5 rounded-xl border px-3 py-2 text-[11px] font-bold ${showMeasurements ? 'border-[#A66331] bg-[#A66331] text-white' : 'border-[#DCE3EA] bg-white text-[#607080]'}`}><Ruler size={14} /> Measurements {showMeasurements ? 'on' : 'off'}</button>\n                  </div>'''
          new_toolbar = '''                  <div className="flex flex-wrap items-center justify-end gap-1.5">\n                    <div className="inline-flex min-h-10 items-center rounded-xl border border-[#DCE3EA] bg-[#F7F9FB] p-1" aria-label="Garment view size controls">\n                      <button type="button" onClick={() => setPreviewZoom((value) => Math.max(.75, Number((value - .1).toFixed(2))))} className="grid h-8 w-8 place-items-center rounded-lg text-[#607080] transition hover:bg-white hover:text-[#17324D]" aria-label="Make garment view smaller"><ZoomOut size={14} /></button>\n                      <span className="w-11 text-center font-mono text-[9px] font-bold tabular-nums text-[#52616F]">{Math.round(previewZoom * 100)}%</span>\n                      <button type="button" onClick={() => setPreviewZoom((value) => Math.min(1.8, Number((value + .1).toFixed(2))))} className="grid h-8 w-8 place-items-center rounded-lg text-[#607080] transition hover:bg-white hover:text-[#17324D]" aria-label="Make garment view larger"><ZoomIn size={14} /></button>\n                      <button type="button" onClick={() => setPreviewZoom(1)} className="ml-1 h-8 rounded-lg border-l border-[#DCE3EA] px-2 text-[8px] font-bold uppercase tracking-wide text-[#607080] hover:bg-white hover:text-[#17324D]">Fit</button>\n                      <button type="button" onClick={() => setPreviewZoom(1.18)} className="h-8 rounded-lg px-2 text-[8px] font-bold uppercase tracking-wide text-[#607080] hover:bg-white hover:text-[#17324D]">Default</button>\n                    </div>\n                    <button type="button" aria-pressed={showGuides} onClick={() => setShowGuides((value) => !value)} className={`inline-flex min-h-10 items-center gap-1.5 rounded-xl border px-3 py-2 text-[11px] font-bold ${showGuides ? 'border-[#17324D] bg-[#17324D] text-white' : 'border-[#DCE3EA] bg-white text-[#607080]'}`}><Maximize2 size={14} /> Print area {showGuides ? 'on' : 'off'}</button>\n                    <button type="button" aria-pressed={showMeasurements} onClick={() => setShowMeasurements((value) => !value)} className={`inline-flex min-h-10 items-center gap-1.5 rounded-xl border px-3 py-2 text-[11px] font-bold ${showMeasurements ? 'border-[#A66331] bg-[#A66331] text-white' : 'border-[#DCE3EA] bg-white text-[#607080]'}`}><Ruler size={14} /> Measurements {showMeasurements ? 'on' : 'off'}</button>\n                  </div>'''
          replace_once(seasonal, old_toolbar, new_toolbar, "seasonal preview toolbar")

          old_live_preview = '''<Preview garment={garment} color={color} side="front" placement="front" size={size} previewConfig={previewConfig || {}} zoom={1} artworkScale={100} artworkRotation={0} artworkOffset={{ x: 0, y: 0 }} showGuides={capturing ? false : showGuides} showMeasurements={capturing ? false : showMeasurements} printAreaId="gdp-seasonal-production" seasonalOverlay={<SeasonalOverlay artwork={selected} layout={layout} area={area} text={text} rotation={rotation} editable={!capturing} showSelection={showGuides} onMove={updatePosition} onResize={(value) => { setRequested(value); setApproved(false); setReviewMode(false); }} onRotate={(value) => { setRotation(value); setApproved(false); setReviewMode(false); }} onDelete={() => { setSelected(null); setApproved(false); setReviewMode(false); }} />} />'''
          new_live_preview = '''<Preview garment={garment} color={color} side="front" placement="front" size={size} previewConfig={previewConfig || {}} zoom={capturing ? 1 : previewZoom} artworkScale={100} artworkRotation={0} artworkOffset={{ x: 0, y: 0 }} showGuides={capturing ? false : showGuides} showMeasurements={capturing ? false : showMeasurements} printAreaId="gdp-seasonal-production" seasonalOverlay={<SeasonalOverlay artwork={selected} layout={layout} area={area} text={text} rotation={rotation} editable={!capturing} showSelection={!capturing} onMove={updatePosition} onResize={(value) => { setRequested(value); setApproved(false); setReviewMode(false); }} onRotate={(value) => { setRotation(value); setApproved(false); setReviewMode(false); }} />} />'''
          replace_once(seasonal, old_live_preview, new_live_preview, "seasonal live preview zoom")

          replace_once(
              seasonal,
              '''                <p className="px-2 pb-1 pt-3 text-center text-xs text-[#61717F]"><Move size={12} className="mr-1 inline" /> Drag to move · pinch to resize · twist to rotate. Double-tap customizable artwork to jump to wording.</p>''',
              '''                <p className="px-2 pb-1 pt-3 text-center text-xs text-[#61717F]"><Move size={12} className="mr-1 inline" /> Drag artwork to move · use the red corner to resize · pinch and twist on touch. Garment zoom only changes your editing view, not print size.</p>''',
              "seasonal editor hint",
          )

          custom = "src/pages/CustomStudio.jsx"
          replace_once(custom, "function clampPreview(value) {\n  return Math.min(1.8, Math.max(0.7, Number(Number(value).toFixed(2))));\n}", "function clampPreview(value) {\n  return Math.min(2, Math.max(0.7, Number(Number(value).toFixed(2))));\n}", "shared zoom range")
          replace_once(custom, "  const [previewZoom, setPreviewZoom] = useState(1);", "  const [previewZoom, setPreviewZoom] = useState(1.15);", "shared default preview zoom")
          replace_once(custom, "    setPreviewZoom(clampPreview(draft.previewZoom || 1));", "    setPreviewZoom(clampPreview(draft.previewZoom || 1.15));", "shared restored preview zoom")

          custom_text = Path(custom).read_text()
          reset_count = custom_text.count("    setPreviewZoom(1);")
          if reset_count != 2:
              raise SystemExit(f"shared reset zoom: expected 2 matches, found {reset_count}")
          Path(custom).write_text(custom_text.replace("    setPreviewZoom(1);", "    setPreviewZoom(1.15);"))

          advanced = "src/components/storefront/CustomStudioAdvancedEditor.jsx"
          replace_once(
              advanced,
              '''          <button type="button" onClick={() => onPreviewZoomChange?.(Math.min(1.8, Number(previewZoom || 1) + .1))} className="grid h-9 w-9 place-items-center rounded-xl border border-white/10 bg-white/[.04] text-white/65" aria-label="Zoom in"><ZoomIn size={14}/></button>\n          <button type="button" onClick={() => onPreviewZoomChange?.(1)} className="h-9 rounded-xl border border-white/10 bg-white/[.04] px-2.5 text-[8px] font-bold uppercase text-white/65">Fit</button>''',
              '''          <button type="button" onClick={() => onPreviewZoomChange?.(Math.min(2, Number(previewZoom || 1) + .1))} className="grid h-9 w-9 place-items-center rounded-xl border border-white/10 bg-white/[.04] text-white/65" aria-label="Zoom in"><ZoomIn size={14}/></button>\n          <button type="button" onClick={() => onPreviewZoomChange?.(1)} className="h-9 rounded-xl border border-white/10 bg-white/[.04] px-2.5 text-[8px] font-bold uppercase text-white/65">Fit</button>\n          <button type="button" onClick={() => onPreviewZoomChange?.(1.15)} className="h-9 rounded-xl border border-white/10 bg-white/[.04] px-2.5 text-[8px] font-bold uppercase text-white/65">Default</button>''',
              "advanced canvas zoom controls",
          )

          css = Path("src/components/storefront/customStudioDesktop.css")
          css_text = css.read_text()
          marker = "/* GDP editor reconstruction 2026-09-10 */"
          if marker not in css_text:
              css.write_text(css_text + '''\n\n/* GDP editor reconstruction 2026-09-10 */\n@media (min-width: 1280px) {\n  /* Give the artwork rail less authority and make the garment canvas the hero. */\n  .gdp-studio-active > main > main > .mx-auto > div[class*="xl:grid-cols-[minmax(300px"] {\n    grid-template-columns: minmax(270px, 292px) minmax(680px, 1fr) minmax(350px, 390px);\n    gap: 18px;\n  }\n\n  .gdp-studio-active > main > main .gdp-seasonal-preview-frame {\n    min-height: 640px;\n    max-height: calc(100dvh - 190px);\n  }\n\n  /* Keep editing properties available without letting them visually compete with the canvas. */\n  .gdp-studio-active > main > main section[aria-label="Garment and artwork controls"] {\n    scrollbar-width: thin;\n    scrollbar-color: rgba(23, 50, 77, .22) transparent;\n  }\n}\n\n/* Selection chrome should never cover customer artwork. */\n.gdp-studio-active [data-seasonal-artwork] > div.pointer-events-none {\n  display: none !important;\n}\n\n.gdp-studio-active [data-seasonal-artwork] {\n  transition: box-shadow 140ms ease;\n}\n\n.gdp-studio-active section[aria-label="Garment preview"] .gdp-seasonal-preview-frame {\n  min-height: clamp(500px, 62dvh, 720px);\n}\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Verify focused regression scripts
        run: |
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial

      - name: Commit validated reconstruction
        shell: bash
        run: |
          git config user.name "gdp-editor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-editor-reconstruction.yml
          git add src/components/storefront/SeasonalStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx src/components/storefront/customStudioDesktop.css src/pages/CustomStudio.jsx
          git commit -m "feat: reconstruct Custom Studio editing workspace"
          git push origin HEAD:feat/editor-reconstruction-sept10
