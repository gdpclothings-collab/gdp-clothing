name: Apply Payment Fields Default

on:
  push:
    branches:
      - fix/payment-fields-default-20261004
    paths:
      - scripts/apply-payment-fields-default-v2.mjs
      - .github/workflows/apply-payment-fields-default.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply payment fields default patch
        run: node scripts/apply-payment-fields-default-v2.mjs
      - name: Verify checkout consent flow
        run: node scripts/verify-checkout-terms-hotfix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Check whitespace
        run: git diff --check
      - name: Commit patched checkout
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "gdp-clothing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/CheckoutTwoStep.jsx src/lib/customerApi.js supabase/functions/checkout/index.ts scripts/verify-checkout-terms-hotfix.mjs
          git commit -m "fix: show Stripe payment fields by default"
          git push origin HEAD:fix/payment-fields-default-20261004
