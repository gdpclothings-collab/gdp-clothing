name: Temporary garment Continue placement

on:
  push:
    branches:
      - refine/custom-studio-garment-continue-20260916
    paths:
      - .github/workflows/tmp-place-garment-continue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refine/custom-studio-garment-continue-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch Step 1 Continue placement
        run: node scripts/tmp-place-garment-continue.mjs
      - name: Verify V2 regression contract
        run: node scripts/verify-custom-studio-v2.mjs
      - name: Commit patch and remove temporary runner
        run: |
          rm scripts/tmp-place-garment-continue.mjs
          rm .github/workflows/tmp-place-garment-continue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx scripts/verify-custom-studio-v2.mjs scripts/tmp-place-garment-continue.mjs .github/workflows/tmp-place-garment-continue.yml
          git commit -m "refine: place garment Continue below selected options"
          git push origin HEAD:refine/custom-studio-garment-continue-20260916
