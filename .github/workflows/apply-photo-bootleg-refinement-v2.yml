name: Apply Photo Bootleg Editor Refinement V2

on:
  push:
    branches:
      - refine/photo-bootleg-editor-v2

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v5
        with:
          ref: refine/photo-bootleg-editor-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply scoped Photo Bootleg editor refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          studio_path = Path('src/pages/CustomStudio.jsx')
          editor_path = Path('src/components/storefront/CustomStudioAdvancedEditor.jsx')
          verify_path = Path('scripts/verify-photo-bootleg-desktop.mjs')
          studio = studio_path.read_text()
          editor = editor_path.read_text()
          verify = verify_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          old_delete = "\n".join([
              '  const deleteActivePhoto = () => {',
              '    if (selectedPhotoIndex < 0) return;',
              '    removePhoto(selectedPhotoIndex);',
              '  };',
          ])
          new_delete = "\n".join([
              '  const deleteActivePhoto = () => {',
              '    if (selectedPhotoIndex < 0) return;',
              '    const photo = photos[selectedPhotoIndex];',
              '    if (designPath === "bootleg" && photo && typeof window !== "undefined") {',
              '      const photoId = String(photo.id || "");',
              '      const usedSides = ["front", "back"].filter((side) => (editorLayersBySide[side] || []).some((layer) => layer.type === "photo" && String(layer.photoId || "") === photoId));',
              '      const usedMessage = usedSides.length ? ` It is currently placed on ${usedSides.join(" and ")}.` : "";',
              '      const label = String(photo.name || "this uploaded photo");',
              '      const confirmed = window.confirm(`Delete "${label}" from this custom project?${usedMessage} This removes every editable instance of the photo from both fabrics. Protected GDP template artwork will stay.`);',
              '      if (!confirmed) return;',
              '    }',
              '    removePhoto(selectedPhotoIndex);',
              '  };',
          ])
          studio = replace_once(studio, old_delete, new_delete, 'global photo deletion confirmation')

          photo_tools_start = editor.index('  const photoContextTools =')
          text_tools_start = editor.index('  const textContextTools =', photo_tools_start)
          photo_tools = editor[photo_tools_start:text_tools_start]
          photo_tools = replace_once(photo_tools, '["more", Layers, "More"]', '["remove", Trash2, "Remove"]', 'Bootleg contextual remove tool')
          editor = editor[:photo_tools_start] + photo_tools + editor[text_tools_start:]

          old_tabs = "\n".join([
              '  const panelTabs = /** @type {Array<[string, React.ComponentType<any>, string]>} */ ([',
              '    ...(designPath !== "upload" ? [["design", Palette, "Design"]] : []),',
              '    ["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Media"],',
              '    ...(tools.text ? [["lettering", Type, "Text"]] : []),',
              '    ...(designPath === "memorial" ? [["details", Heart, "Details"]] : []),',
              '    ["layers", Layers, "Layers"],',
              '  ]);',
          ])
          new_tabs = "\n".join([
              '  const panelTabs = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [',
              '    ["design", Palette, "Template"],',
              '    ["photos", ImageIcon, "Photos"],',
              '    ...(tools.text ? [["lettering", Type, "Text"]] : []),',
              '    ["layers", Layers, "Layers"],',
              '  ] : [',
              '    ...(designPath !== "upload" ? [["design", Palette, "Design"]] : []),',
              '    ["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Media"],',
              '    ...(tools.text ? [["lettering", Type, "Text"]] : []),',
              '    ...(designPath === "memorial" ? [["details", Heart, "Details"]] : []),',
              '    ["layers", Layers, "Layers"],',
              '  ]);',
          ])
          editor = replace_once(editor, old_tabs, new_tabs, 'simplified Bootleg primary tabs')

          photo_start = editor.index('  const renderPhotoTool = () => {')
          photo_end = editor.index('  const renderTextTool = () => {', photo_start)
          photo_block = editor[photo_start:photo_end]
          old_more = "\n".join([
              '    if (activeTool === "more") return <LayerActionRow layer={selectedLayer} onDuplicate={onDuplicateLayer} onDelete={onDeleteLayer} onMoveLayer={onMoveLayer} onReset={onResetLayer}/>;',
              '',
              '    return (',
              '      <div className="space-y-3">',
          ])
          new_more = "\n".join([
              '    if (activeTool === "remove") {',
              '      return (',
              '        <div className="space-y-2">',
              '          <div className="rounded-xl border border-white/10 bg-white/[.035] p-3 text-[10px] leading-relaxed text-white/55"><strong className="text-white/85">Remove from {previewSide}:</strong> keeps the upload available in Photos and leaves the locked GDP template untouched.</div>',
              '          <button type="button" onClick={() => onDeleteLayer?.(selectedLayer.id)} className="w-full rounded-xl border border-[#D9273E]/35 bg-[#D9273E]/10 px-4 py-3 text-[10px] font-bold uppercase text-[#FFB2BD]"><Trash2 size={15} className="mr-2 inline"/>Remove from {previewSide} fabric</button>',
              '          <button type="button" onClick={onDeletePhoto} className="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 text-[9px] font-bold uppercase text-white/62">Delete upload everywhere</button>',
              '          <p className="px-1 text-[8px] leading-relaxed text-white/35">Delete upload everywhere removes this customer photo from both fabrics after confirmation. Protected template artwork is never deleted.</p>',
              '        </div>',
              '      );',
              '    }',
              '',
              '    if (activeTool === "more") return <LayerActionRow layer={selectedLayer} onDuplicate={onDuplicateLayer} onDelete={onDeleteLayer} onMoveLayer={onMoveLayer} onReset={onResetLayer}/>;',
              '',
              '    return (',
              '      <div className="space-y-3">',
          ])
          photo_block = replace_once(photo_block, old_more, new_more, 'Bootleg removal semantics')
          editor = editor[:photo_start] + photo_block + editor[photo_end:]

          old_title = '<div className="mt-1 truncate text-xs font-bold text-white">{pathLabel || (selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : hasPhoto ? "Photo tools" : "Personalization controls")}</div>'
          new_title = '<div className="mt-1 truncate text-xs font-bold text-white">{designPath === "bootleg" && selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : (pathLabel || (selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : hasPhoto ? "Photo tools" : "Personalization controls"))}</div>'
          editor = replace_once(editor, old_title, new_title, 'selected Bootleg layer title')

          old_layer_button = '<button type="button" onClick={() => { setPanelTab("layers"); setActiveTool("layers"); }} className={`grid h-9 w-9 place-items-center rounded-xl border ${panelTab === "layers" ? "border-[#D9273E] bg-[#D9273E]/15 text-white" : "border-white/10 bg-white/[.045] text-white/65"}`} aria-label="Layers"><Layers size={14}/></button>'
          new_layer_button = '{designPath !== "bootleg" && <button type="button" onClick={() => { setPanelTab("layers"); setActiveTool("layers"); }} className={`grid h-9 w-9 place-items-center rounded-xl border ${panelTab === "layers" ? "border-[#D9273E] bg-[#D9273E]/15 text-white" : "border-white/10 bg-white/[.045] text-white/65"}`} aria-label="Layers"><Layers size={14}/></button>}'
          editor = replace_once(editor, old_layer_button, new_layer_button, 'remove redundant Bootleg header layer button')

          editor = replace_once(
              editor,
              '{viewGuidance && <div className="mt-2 border-l-2 border-[#D9273E]/60 pl-2.5">{viewGuidance}</div>}',
              '{viewGuidance && designPath !== "bootleg" && <div className="mt-2 border-l-2 border-[#D9273E]/60 pl-2.5">{viewGuidance}</div>}',
              'hide redundant Bootleg guidance',
          )
          editor = replace_once(
              editor,
              '<span>Media library</span><span>{photoAssets.length}/{maxPhotos}</span>',
              '<span>{designPath === "bootleg" ? "Uploaded photos" : "Media library"}</span><span>{photoAssets.length}/{maxPhotos}</span>',
              'Bootleg media label',
          )

          if "const editor = fs.readFileSync('src/components/storefront/CustomStudioAdvancedEditor.jsx', 'utf8');" not in verify:
              verify = verify.replace(
                  "const desktopCss = fs.readFileSync('src/components/storefront/customStudioDesktop.css', 'utf8');",
                  "const desktopCss = fs.readFileSync('src/components/storefront/customStudioDesktop.css', 'utf8');\nconst editor = fs.readFileSync('src/components/storefront/CustomStudioAdvancedEditor.jsx', 'utf8');"
              )
          if "Bootleg photo tools expose a dedicated remove action" not in verify:
              extra = "\n".join([
                  "assert(studio.includes('This removes every editable instance of the photo from both fabrics.'), 'global uploaded-photo deletion is explicit and confirmed');",
                  "assert(editor.includes('[\\\"remove\\\", Trash2, \\\"Remove\\\"]'), 'Bootleg photo tools expose a dedicated remove action');",
                  "assert(editor.includes('Remove from {previewSide} fabric'), 'active-side removal is distinct from deleting the uploaded asset');",
                  "assert(editor.includes('Delete upload everywhere'), 'global uploaded-photo deletion remains available as a separate action');",
                  "assert(editor.includes('[\\\"design\\\", Palette, \\\"Template\\\"]'), 'Bootleg editor uses a simplified Template tab label');",
                  "assert(editor.includes('[\\\"photos\\\", ImageIcon, \\\"Photos\\\"]'), 'Bootleg editor uses a simplified Photos tab label');",
                  "assert(editor.includes('viewGuidance && designPath !== \\\"bootleg\\\"'), 'duplicate long guidance is suppressed in the simplified Bootleg inspector');",
              ])
              anchor = "assert(studio.includes('Remove photo'), 'selected customer photo can be removed directly from the active fabric');"
              verify = replace_once(verify, anchor, anchor + '\n' + extra, 'extend Photo Bootleg regression guard')

          studio_path.write_text(studio)
          editor_path.write_text(editor)
          verify_path.write_text(verify)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Photo Bootleg regression guard
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Run existing Custom Studio desktop guard
        run: node scripts/verify-custom-studio-desktop.mjs

      - name: Verify Seasonal Studio remains intact
        run: node scripts/verify-seasonal-artwork.mjs

      - name: Verify Memorial workflow remains intact
        run: npm run test:memorial

      - name: Build production app
        run: npm run build

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-photo-bootleg-refinement-v2.yml
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "refine: simplify Photo Bootleg editor actions"
          git push origin HEAD:refine/photo-bootleg-editor-v2
