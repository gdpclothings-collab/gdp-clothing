name: Apply Photo Bootleg Editor Refinement V2

on:
  push:
    branches:
      - refine/photo-bootleg-editor-v2

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v5
        with:
          ref: refine/photo-bootleg-editor-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply scoped Photo Bootleg editor refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          studio_path = Path('src/pages/CustomStudio.jsx')
          editor_path = Path('src/components/storefront/CustomStudioAdvancedEditor.jsx')
          verify_path = Path('scripts/verify-photo-bootleg-desktop.mjs')
          studio = studio_path.read_text()
          editor = editor_path.read_text()
          verify = verify_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          studio = replace_once(
              studio,
              '''  const deleteActivePhoto = () => {
            if (selectedPhotoIndex < 0) return;
            removePhoto(selectedPhotoIndex);
          };''',
              '''  const deleteActivePhoto = () => {
            if (selectedPhotoIndex < 0) return;
            const photo = photos[selectedPhotoIndex];
            if (designPath === "bootleg" && photo && typeof window !== "undefined") {
              const photoId = String(photo.id || "");
              const usedSides = ["front", "back"].filter((side) => (editorLayersBySide[side] || []).some((layer) => layer.type === "photo" && String(layer.photoId || "") === photoId));
              const usedMessage = usedSides.length ? ` It is currently placed on ${usedSides.join(" and ")}.` : "";
              const label = String(photo.name || "this uploaded photo");
              const confirmed = window.confirm(`Delete "${label}" from this custom project?${usedMessage} This removes every editable instance of the photo from both fabrics. Protected GDP template artwork will stay.`);
              if (!confirmed) return;
            }
            removePhoto(selectedPhotoIndex);
          };''',
              'global photo deletion confirmation',
          )

          editor = replace_once(
              editor,
              '''  const photoContextTools = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [
            ["transform", Move, "Move / Size"],
            ["crop", Crop, "Crop"],
            ["background", WandSparkles, "Remove BG"],
            ["erase", Eraser, "Erase"],
            ["more", Layers, "More"],
          ] : [''',
              '''  const photoContextTools = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [
            ["transform", Move, "Move / Size"],
            ["crop", Crop, "Crop"],
            ["background", WandSparkles, "Remove BG"],
            ["erase", Eraser, "Erase"],
            ["remove", Trash2, "Remove"],
          ] : [''',
              'Bootleg contextual remove tool',
          )

          editor = replace_once(
              editor,
              '''  const panelTabs = /** @type {Array<[string, React.ComponentType<any>, string]>} */ ([
            ...(designPath !== "upload" ? [["design", Palette, "Design"]] : []),
            ["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Media"],
            ...(tools.text ? [["lettering", Type, "Text"]] : []),
            ...(designPath === "memorial" ? [["details", Heart, "Details"]] : []),
            ["layers", Layers, "Layers"],
          ]);''',
              '''  const panelTabs = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [
            ["design", Palette, "Template"],
            ["photos", ImageIcon, "Photos"],
            ...(tools.text ? [["lettering", Type, "Text"]] : []),
            ["layers", Layers, "Layers"],
          ] : [
            ...(designPath !== "upload" ? [["design", Palette, "Design"]] : []),
            ["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Media"],
            ...(tools.text ? [["lettering", Type, "Text"]] : []),
            ...(designPath === "memorial" ? [["details", Heart, "Details"]] : []),
            ["layers", Layers, "Layers"],
          ]);''',
              'simplified Bootleg primary tabs',
          )

          editor = replace_once(
              editor,
              '''    if (activeTool === "more") return <LayerActionRow layer={selectedLayer} onDuplicate={onDuplicateLayer} onDelete={onDeleteLayer} onMoveLayer={onMoveLayer} onReset={onResetLayer}/>;

              return (
                <div className="space-y-3">''',
              '''    if (activeTool === "remove") {
              return (
                <div className="space-y-2">
                  <div className="rounded-xl border border-white/10 bg-white/[.035] p-3 text-[10px] leading-relaxed text-white/55"><strong className="text-white/85">Remove from {previewSide}:</strong> keeps the upload available in Photos and leaves the locked GDP template untouched.</div>
                  <button type="button" onClick={() => onDeleteLayer?.(selectedLayer.id)} className="w-full rounded-xl border border-[#D9273E]/35 bg-[#D9273E]/10 px-4 py-3 text-[10px] font-bold uppercase text-[#FFB2BD]"><Trash2 size={15} className="mr-2 inline"/>Remove from {previewSide} fabric</button>
                  <button type="button" onClick={onDeletePhoto} className="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 text-[9px] font-bold uppercase text-white/62">Delete upload everywhere</button>
                  <p className="px-1 text-[8px] leading-relaxed text-white/35">Delete upload everywhere removes this customer photo from both fabrics after confirmation. Protected template artwork is never deleted.</p>
                </div>
              );
            }

            if (activeTool === "more") return <LayerActionRow layer={selectedLayer} onDuplicate={onDuplicateLayer} onDelete={onDeleteLayer} onMoveLayer={onMoveLayer} onReset={onResetLayer}/>;

              return (
                <div className="space-y-3">''',
              'Bootleg removal semantics',
          )

          editor = replace_once(
              editor,
              '''          <div className="mt-1 truncate text-xs font-bold text-white">{pathLabel || (selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : hasPhoto ? "Photo tools" : "Personalization controls")}</div>''',
              '''          <div className="mt-1 truncate text-xs font-bold text-white">{designPath === "bootleg" && selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : (pathLabel || (selectedLayer ? labelForLayer(selectedLayer, Math.max(0, editorLayers.findIndex((item) => item.id === selectedLayer.id)), photosById) : hasPhoto ? "Photo tools" : "Personalization controls"))}</div>''',
              'selected Bootleg layer title',
          )

          editor = replace_once(
              editor,
              '''          <button type="button" onClick={() => { setPanelTab("layers"); setActiveTool("layers"); }} className={`grid h-9 w-9 place-items-center rounded-xl border ${panelTab === "layers" ? "border-[#D9273E] bg-[#D9273E]/15 text-white" : "border-white/10 bg-white/[.045] text-white/65"}`} aria-label="Layers"><Layers size={14}/></button>''',
              '''          {designPath !== "bootleg" && <button type="button" onClick={() => { setPanelTab("layers"); setActiveTool("layers"); }} className={`grid h-9 w-9 place-items-center rounded-xl border ${panelTab === "layers" ? "border-[#D9273E] bg-[#D9273E]/15 text-white" : "border-white/10 bg-white/[.045] text-white/65"}`} aria-label="Layers"><Layers size={14}/></button>}''',
              'remove redundant Bootleg header layer button',
          )

          editor = replace_once(
              editor,
              '''        {viewGuidance && <div className="mt-2 border-l-2 border-[#D9273E]/60 pl-2.5">{viewGuidance}</div>}''',
              '''        {viewGuidance && designPath !== "bootleg" && <div className="mt-2 border-l-2 border-[#D9273E]/60 pl-2.5">{viewGuidance}</div>}''',
              'hide redundant Bootleg guidance',
          )

          editor = replace_once(
              editor,
              '''<span>Media library</span><span>{photoAssets.length}/{maxPhotos}</span>''',
              '''<span>{designPath === "bootleg" ? "Uploaded photos" : "Media library"}</span><span>{photoAssets.length}/{maxPhotos}</span>''',
              'Bootleg media label',
          )

          marker = "assert(editor.includes('[\"remove\", Trash2, \"Remove\"]')"
          if marker not in verify:
              verify = verify.replace(
                  "const desktopCss = fs.readFileSync('src/components/storefront/customStudioDesktop.css', 'utf8');",
                  "const desktopCss = fs.readFileSync('src/components/storefront/customStudioDesktop.css', 'utf8');\nconst editor = fs.readFileSync('src/components/storefront/CustomStudioAdvancedEditor.jsx', 'utf8');"
              )
              verify = verify.replace(
                  "assert(studio.includes('Remove photo'), 'selected customer photo can be removed directly from the active fabric');",
                  "assert(studio.includes('Remove photo'), 'selected customer photo can be removed directly from the active fabric');\nassert(studio.includes('This removes every editable instance of the photo from both fabrics.'), 'global uploaded-photo deletion is explicit and confirmed');\nassert(editor.includes('[\\\"remove\\\", Trash2, \\\"Remove\\\"]'), 'Bootleg photo tools expose a dedicated remove action');\nassert(editor.includes('Remove from {previewSide} fabric'), 'active-side removal is distinct from deleting the uploaded asset');\nassert(editor.includes('Delete upload everywhere'), 'global uploaded-photo deletion remains available as a separate action');\nassert(editor.includes('[\\\"design\\\", Palette, \\\"Template\\\"]'), 'Bootleg editor uses a simplified Template tab label');\nassert(editor.includes('[\\\"photos\\\", ImageIcon, \\\"Photos\\\"]'), 'Bootleg editor uses a simplified Photos tab label');\nassert(editor.includes('viewGuidance && designPath !== \\\"bootleg\\\"'), 'duplicate long guidance is suppressed in the simplified Bootleg inspector');"
              )

          studio_path.write_text(studio)
          editor_path.write_text(editor)
          verify_path.write_text(verify)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Photo Bootleg regression guard
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Run existing Custom Studio desktop guard
        run: node scripts/verify-custom-studio-desktop.mjs

      - name: Verify Seasonal Studio remains intact
        run: node scripts/verify-seasonal-artwork.mjs

      - name: Verify Memorial workflow remains intact
        run: npm run test:memorial

      - name: Build production app
        run: npm run build

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-photo-bootleg-refinement-v2.yml
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "refine: simplify Photo Bootleg editor actions"
          git push origin HEAD:refine/photo-bootleg-editor-v2
