name: Apply Custom Studio refinement

on:
  push:
    branches:
      - refine/custom-studio-canvas-controls-20260910
    paths:
      - .github/workflows/apply-custom-studio-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refine/custom-studio-canvas-controls-20260910
          fetch-depth: 0

      - name: Apply guarded patch
        run: python scripts/apply-custom-studio-refinement.py

      - name: Preserve editor status controls and clean output
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("src/components/storefront/CustomStudioAdvancedEditor.jsx")
          text = path.read_text()
          marker = '''      {outsideWarning && <div className="mt-2 rounded-xl border border-amber-400/30 bg-amber-400/10 px-3 py-2 text-[9px] font-semibold leading-relaxed text-amber-200"><span className="mr-1 uppercase tracking-wide text-amber-100">Print-area check:</span>{outsideWarning}</div>}\n'''
          addition = marker + '''\n      {(sideStatus || viewGuidance || canCopyFrontToBack) && <div className="mt-2 rounded-xl border border-white/[.08] bg-white/[.035] px-3 py-2.5 text-[9px] leading-relaxed text-white/48">\n        <div className="font-mono text-[8px] uppercase tracking-[.13em] text-white/35">Editing {previewSide}</div>\n        {sideStatus && <div className="mt-1 text-white/68">{sideStatus}</div>}\n        {viewGuidance && <div className="mt-2 border-l-2 border-[#D9273E]/60 pl-2.5">{viewGuidance}</div>}\n        {canCopyFrontToBack && <button type="button" onClick={onCopyFrontToBack} className="mt-2.5 w-full rounded-xl border border-white/15 bg-white/[.05] px-3 py-2 text-[9px] font-bold uppercase text-white">Copy front design to back</button>}\n      </div>}\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"view status insertion marker expected once, found {text.count(marker)}")
          text = text.replace(marker, addition, 1)
          text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Focused regression tests
        run: |
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          npm run test:dtf-nesting

      - name: Commit refined editor
        run: |
          git config user.name "GDP Clothing CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/storefront/CustomStudioAdvancedEditor.jsx src/pages/CustomStudio.jsx src/components/storefront/customStudioDesktop.css src/components/storefront/customStudioMobile.css
          git diff --cached --check
          git commit -m "refine custom studio garment canvas controls"
          git push origin HEAD:refine/custom-studio-canvas-controls-20260910
