name: Apply Custom Studio refinement

on:
  push:
    branches:
      - fix/custom-studio-draft-review-zoom-20260910

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-studio-draft-review-zoom-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source refinements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block not found: {label}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          custom = "src/pages/CustomStudio.jsx"
          seasonal = "src/components/storefront/SeasonalStudio.jsx"

          replace_once(
              custom,
              '  const [seasonalMode, setSeasonalMode] = useState(false);\n  const [designPath, setDesignPath] = useState("");',
              '  const [seasonalMode, setSeasonalMode] = useState(false);\n  const [seasonalDraft, setSeasonalDraft] = useState(null);\n  const [designPath, setDesignPath] = useState("");',
              "seasonal draft parent state",
          )

          replace_once(
              custom,
              '        if (location.state?.seasonalDraft) setSeasonalMode(true);',
              '        if (location.state?.seasonalDraft) {\n          setSeasonalDraft(location.state.seasonalDraft);\n          setSeasonalMode(true);\n        }',
              "cart seasonal draft initialization",
          )

          replace_once(
              custom,
              '    setArtworkStates(draft.artworkStates || defaultArtworkStates());\n    setPreviewZoom(clampPreview(draft.previewZoom || 1.15));\n    setRightsConfirmed(false);',
              '    setArtworkStates(draft.artworkStates || defaultArtworkStates());\n    setPreviewZoom(clampPreview(draft.previewZoom || 1.15));\n    const restoredSeasonalDraft =\n      draft.designPath === "seasonal" && draft.seasonalDraft?.artworkId\n        ? draft.seasonalDraft\n        : null;\n    setSeasonalDraft(restoredSeasonalDraft);\n    setSeasonalMode(Boolean(restoredSeasonalDraft));\n    setRightsConfirmed(false);',
              "resume seasonal draft state",
          )

          replace_once(
              custom,
              '    setPendingDraft(null);\n    setDraftRestored(false);',
              '    setSeasonalDraft(null);\n    setSeasonalMode(false);\n    setPendingDraft(null);\n    setDraftRestored(false);',
              "fresh studio clears seasonal state",
          )

          replace_once(
              custom,
              '    if (!draftReady || seasonalMode || saving || !product?.id || typeof window === "undefined") return undefined;',
              '    if (!draftReady || saving || !product?.id || typeof window === "undefined") return undefined;',
              "allow autosave in seasonal mode",
          )

          replace_once(
              custom,
              '        artworkStates,\n        previewZoom,\n      };',
              '        artworkStates,\n        previewZoom,\n        seasonalDraft,\n      };',
              "persist seasonal draft payload",
          )

          replace_once(
              custom,
              '  }, [draftReady, seasonalMode, saving, product?.id, step, designPath, designStyle, designMood, designIntensity, color, size, qty, placement, previewSide, groupGarments, photos, editorLayersBySide, selectedEditorLayerIds, personalization, memorialNameConfirmed, needByDate, priority, artworkStates, previewZoom]);',
              '  }, [draftReady, seasonalMode, saving, product?.id, step, designPath, designStyle, designMood, designIntensity, color, size, qty, placement, previewSide, groupGarments, photos, editorLayersBySide, selectedEditorLayerIds, personalization, memorialNameConfirmed, needByDate, priority, artworkStates, previewZoom, seasonalDraft]);',
              "autosave seasonal draft dependency",
          )

          replace_once(
              custom,
              '    initialDraft={location.state?.seasonalDraft || null} editCartKey={location.state?.editCartKey || ""}\n    onBack={() => {setSeasonalMode(false);setStep(1);window.scrollTo({top:0,behavior:\'instant\'});}} />;',
              '    initialDraft={seasonalDraft || location.state?.seasonalDraft || null} editCartKey={location.state?.editCartKey || ""}\n    onDraftChange={setSeasonalDraft}\n    onBack={() => {setSeasonalMode(false);setStep(1);window.scrollTo({top:0,behavior:\'instant\'});}} />;',
              "wire seasonal draft callback",
          )

          replace_once(
              seasonal,
              "import React, { useEffect, useRef, useState } from 'react';",
              "import React, { useEffect, useMemo, useRef, useState } from 'react';",
              "memo import",
          )

          replace_once(
              seasonal,
              "export default function SeasonalStudio({ product, garment, color, size, variant, quantity, unitPrice, Preview, onBack, catalog: garmentCatalog = [], availableColors = [], availableSizes = [], onProductChange, onColorChange, onSizeChange, colorSwatch, priceVisibility = 'hidden', initialDraft = null, editCartKey = '' }) {",
              "export default function SeasonalStudio({ product, garment, color, size, variant, quantity, unitPrice, Preview, onBack, catalog: garmentCatalog = [], availableColors = [], availableSizes = [], onProductChange, onColorChange, onSizeChange, colorSwatch, priceVisibility = 'hidden', initialDraft = null, editCartKey = '', onDraftChange = undefined }) {",
              "seasonal draft callback prop",
          )

          replace_once(
              seasonal,
              '  const [previewZoom, setPreviewZoom] = useState(1.18);\n  const [reviewMode, setReviewMode] = useState(false);',
              '  const [previewZoom, setPreviewZoom] = useState(1.18);\n  const [reviewZoom, setReviewZoom] = useState(1);\n  const [reviewMode, setReviewMode] = useState(false);',
              "review zoom state",
          )

          replace_once(
              seasonal,
              "  const area = catalog?.area;\n  const layout = fitSeasonalArtwork(selected, area, requested, position.x, position.y);",
              "  const area = catalog?.area;\n  const layout = useMemo(\n    () => fitSeasonalArtwork(selected, area, requested, position.x, position.y),\n    [selected, area, requested, position.x, position.y]\n  );",
              "stable seasonal layout",
          )

          replace_once(
              seasonal,
              "    setRotation(Number(initialDraft.rotation || 0));\n    setCategory(initialDraft.category || '');\n  }, [catalog, initialDraft?.artworkId]);",
              "    setRotation(Number(initialDraft.rotation || 0));\n    setCategory(initialDraft.category || '');\n    if (Number.isFinite(Number(initialDraft.previewZoom))) {\n      setPreviewZoom(Math.max(.75, Math.min(1.8, Number(initialDraft.previewZoom))));\n    }\n    if (Number.isFinite(Number(initialDraft.reviewZoom))) {\n      setReviewZoom(Math.max(.75, Math.min(1.8, Number(initialDraft.reviewZoom))));\n    }\n    setReviewMode(Boolean(initialDraft.reviewMode));\n    setApproved(false);\n  }, [catalog, initialDraft?.artworkId]);\n\n  useEffect(() => {\n    if (!onDraftChange || !selected || !layout) return;\n    onDraftChange({\n      artworkId: selected.id,\n      artworkTitle: selected.title,\n      width: Number(layout.width),\n      height: Number(layout.height),\n      position: { x: Number(layout.x), y: Number(layout.y) },\n      rotation: Number(rotation),\n      category: selected.category,\n      printSide: 'front',\n      previewZoom: Number(previewZoom),\n      reviewZoom: Number(reviewZoom),\n      reviewMode: Boolean(reviewMode),\n    });\n  }, [onDraftChange, selected, layout, rotation, previewZoom, reviewZoom, reviewMode]);",
              "restore and publish seasonal draft",
          )

          replace_once(
              seasonal,
              '              <div><div ref={approvedPreviewRef}',
              '              <div>\n                <div className="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-[#DCE3EA] bg-[#F7F9FB] p-2.5">\n                  <div><p className="text-[10px] font-bold uppercase tracking-[.12em] text-[#71808D]">Review view</p><p className="text-[11px] text-[#61717F]">Zoom is for inspection only. Print size and placement stay locked.</p></div>\n                  <div className="inline-flex min-h-10 items-center rounded-xl border border-[#DCE3EA] bg-white p-1" aria-label="Review garment zoom controls">\n                    <button type="button" onClick={() => setReviewZoom((value) => Math.max(.75, Number((value - .1).toFixed(2))))} className="grid h-8 w-8 place-items-center rounded-lg text-[#607080] transition hover:bg-[#F7F9FB] hover:text-[#17324D]" aria-label="Zoom review garment out"><ZoomOut size={14} /></button>\n                    <span className="w-11 text-center font-mono text-[9px] font-bold tabular-nums text-[#52616F]">{Math.round(reviewZoom * 100)}%</span>\n                    <button type="button" onClick={() => setReviewZoom((value) => Math.min(1.8, Number((value + .1).toFixed(2))))} className="grid h-8 w-8 place-items-center rounded-lg text-[#607080] transition hover:bg-[#F7F9FB] hover:text-[#17324D]" aria-label="Zoom review garment in"><ZoomIn size={14} /></button>\n                    <button type="button" onClick={() => setReviewZoom(1)} className="ml-1 h-8 border-l border-[#DCE3EA] px-2 text-[8px] font-bold uppercase tracking-wide text-[#607080] hover:text-[#17324D]">Fit</button>\n                  </div>\n                </div>\n                <div ref={approvedPreviewRef}',
              "review zoom controls",
          )

          review_preview_old = '<Preview garment={garment} color={color} side="front" placement="front" size={size} previewConfig={previewConfig || {}} zoom={1} artworkScale={100} artworkRotation={0} artworkOffset={{ x: 0, y: 0 }} showGuides={false} showMeasurements={false} printAreaId="gdp-seasonal-production" seasonalOverlay={<SeasonalOverlay artwork={selected} layout={layout} area={area} rotation={rotation} />} />'
          review_preview_new = '<Preview garment={garment} color={color} side="front" placement="front" size={size} previewConfig={previewConfig || {}} zoom={capturing ? 1 : reviewZoom} artworkScale={100} artworkRotation={0} artworkOffset={{ x: 0, y: 0 }} showGuides={false} showMeasurements={false} printAreaId="gdp-seasonal-production" seasonalOverlay={<SeasonalOverlay artwork={selected} layout={layout} area={area} rotation={rotation} />} />'
          replace_once(seasonal, review_preview_old, review_preview_new, "review zoom preview binding")

          replace_once(
              seasonal,
              '<ReviewDetail label="Position" value={`${layout.x.toFixed(2)} in from left · ${layout.y.toFixed(2)} in from top`} />',
              '<ReviewDetail label="Position in print area" value={`Left ${layout.x.toFixed(2)} in · Top ${layout.y.toFixed(2)} in`} />',
              "clear position coordinates",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Verify lint
        run: npm run lint

      - name: Commit verified refinement
        shell: bash
        run: |
          rm .github/workflows/apply-custom-studio-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/SeasonalStudio.jsx .github/workflows/apply-custom-studio-refinement.yml
          git commit -m "fix: preserve seasonal drafts and add review zoom"
          git push origin HEAD:fix/custom-studio-draft-review-zoom-20260910
