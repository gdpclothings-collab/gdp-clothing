name: Patch V2 preview and gestures

on:
  push:
    branches:
      - rebuild/custom-studio-v2-interaction-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/custom-studio-v2-interaction-parity
      - name: Apply deterministic source patch
        run: python .github/patch-v2-preview-gestures.py
      - name: Validate patch contract
        run: |
          test ! -e .github/workflows/patch-v2-preview-gestures.yml
          test ! -e .github/patch-v2-preview-gestures.py
          grep -q "studioV2GarmentPreview" src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
          grep -q "pinch/rotate" src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx
          grep -q "Move text left / right" src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
      - name: Commit patched V2 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align V2 touch gestures and side-aware previews"
          git push origin HEAD:rebuild/custom-studio-v2-interaction-parity
