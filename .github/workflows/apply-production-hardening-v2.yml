name: Apply GDP Production Hardening v2

on:
  push:
    branches: ["hardening/production-flow-2026-09-12"]
    paths: [".github/workflows/apply-production-hardening-v2.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/production-flow-2026-09-12
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply hardening patch
        run: node scripts/apply-production-hardening.mjs
      - name: Normalize Stripe idempotency header placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/checkout/index.ts")
          s = p.read_text()
          idempotency = '        "Idempotency-Key": `gdp-checkout-${checkoutSessionToken}`,\n'
          s = s.replace(idempotency, '')
          start = s.index('const stripeResponse = await fetch("https://api.stripe.com/v1/checkout/sessions", {')
          version = '"Stripe-Version": "2026-08-26.dahlia",'
          pos = s.index(version, start) + len(version)
          s = s[:pos] + '\n' + idempotency.rstrip('\n') + s[pos:]
          p.write_text(s)
          PY
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          node scripts/verify-seasonal-artwork.mjs
          node scripts/verify-photo-bootleg-desktop.mjs
          npm run build
      - name: Commit verified changes
        run: |
          rm -f scripts/apply-production-hardening.mjs
          rm -f .github/workflows/apply-production-hardening.yml
          rm -f .github/workflows/apply-production-hardening-v2.yml
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden production checkout and security flow"
          git push origin HEAD:hardening/production-flow-2026-09-12
