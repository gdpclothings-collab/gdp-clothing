name: Apply Ready-to-Wear Savings Foundation

on:
  push:
    branches:
      - feat/ready-to-wear-savings-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/ready-to-wear-savings-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply targeted pricing patch
        run: node scripts/apply-ready-to-wear-savings-foundation.mjs

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit targeted changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/apparelPricing.js src/lib/cartPricing.js src/pages/ProductDetail.jsx src/pages/Cart.jsx src/pages/AdminPricing.jsx supabase/functions/checkout/index.ts
          git commit -m "Add Ready-to-Wear Buy More & Save foundation"
          git push origin HEAD:feat/ready-to-wear-savings-foundation
