name: Tighten Ready-to-Wear Checkout Scope

on:
  push:
    branches:
      - feat/ready-to-wear-savings-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ready-to-wear-savings-foundation
          fetch-depth: 0
      - name: Restrict server pricing to Ready-to-Wear selling mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/checkout/index.ts")
          text = p.read_text()
          old = '      } else if (apparelPricing.enabled && apparelPricing.readyToWear?.enabled && product.custom_designable !== true) {'
          new = '      } else if (apparelPricing.enabled && apparelPricing.readyToWear?.enabled && String(product.selling_mode || "").trim().toLowerCase() === "ready_to_wear") {'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one Ready-to-Wear eligibility target, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit scope hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/checkout/index.ts
          git commit -m "Restrict quantity savings to Ready-to-Wear products"
          git push origin HEAD:feat/ready-to-wear-savings-foundation
