name: Apply Canada Post checkout integration

on:
  push:
    paths:
      - ".github/workflows/apply-canada-post-checkout.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checkout = Path('src/pages/Checkout.jsx')
          text = checkout.read_text()

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { customerApi } from "@/lib/customerApi";\n',
              'import { customerApi } from "@/lib/customerApi";\nimport { supabase } from "@/lib/supabaseClient";\n',
              'supabase import'
          )
          replace_once(
              '  const [checkoutConfig, setCheckoutConfig] = useState(null);\n',
              '  const [checkoutConfig, setCheckoutConfig] = useState(null);\n  const [canadaPostRate, setCanadaPostRate] = useState(null);\n  const [shippingRateStatus, setShippingRateStatus] = useState("idle");\n',
              'shipping state'
          )
          replace_once(
              '  const shipping = checkoutConfig?.shipping ?? fallbackShipping;\n',
              '  const shippingIsFree = form.shippingMethod === "pickup" || appliedDiscount?.type === "free_shipping" || afterCoupon >= 150;\n  const shipping = shippingIsFree ? 0 : (canadaPostRate?.price ?? checkoutConfig?.shipping ?? fallbackShipping);\n',
              'shipping calculation'
          )

          marker = '''  useEffect(() => {\n    if (!items.length || checkoutActions || loadedCheckoutStorageKey !== checkoutStorageKey) return undefined;\n'''
          effect = '''  useEffect(() => {\n    if (checkoutActions) return undefined;\n    const postalCode = normalizeCanadianPostalCode(form.postalCode);\n    if (!postalCode || shippingIsFree) {\n      setCanadaPostRate(null);\n      setShippingRateStatus("idle");\n      return undefined;\n    }\n\n    let active = true;\n    setShippingRateStatus("loading");\n    const timer = window.setTimeout(async () => {\n      try {\n        const { data, error: rateError } = await supabase.functions.invoke("canada-post-rates", {\n          body: { destinationPostalCode: postalCode },\n        });\n        if (!active) return;\n        const rate = Array.isArray(data?.rates) ? data.rates[0] : null;\n        if (!rateError && rate && Number.isFinite(Number(rate.price))) {\n          setCanadaPostRate({ ...rate, price: Number(rate.price) });\n          setShippingRateStatus("live");\n        } else {\n          setCanadaPostRate(null);\n          setShippingRateStatus("fallback");\n        }\n      } catch (rateError) {\n        if (!active) return;\n        console.debug("Canada Post rate fallback:", rateError?.message || rateError);\n        setCanadaPostRate(null);\n        setShippingRateStatus("fallback");\n      }\n    }, 350);\n\n    return () => {\n      active = false;\n      window.clearTimeout(timer);\n    };\n  }, [form.postalCode, shippingIsFree, checkoutActions]);\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('rate effect marker mismatch')
          text = text.replace(marker, effect + marker, 1)

          replace_once(
              '                icon={Truck} title="Standard Shipping" desc={shipping === 0 ? "FREE · 3-7 business days" : `$${shipping.toFixed(2)} · 3-7 business days`} />',
              '                icon={Truck} title="Standard Shipping" desc={shipping === 0 ? "FREE · 3-7 business days" : shippingRateStatus === "loading" ? "Calculating Canada Post rate…" : canadaPostRate ? `$${shipping.toFixed(2)} · Canada Post estimate` : `$${shipping.toFixed(2)} · estimated shipping`} />',
              'shipping label'
          )
          checkout.write_text(text)

          backend = Path('supabase/functions/checkout/index.ts')
          b = backend.read_text()
          helper_marker = 'async function getCheckoutRules(\n'
          helper = '''async function getCanadaPostEstimate(postalCode: unknown) {\n  const normalized = normalizeCanadianPostalCode(postalCode);\n  const supabaseUrl = Deno.env.get("SUPABASE_URL") || "";\n  if (!normalized || !supabaseUrl) return null;\n  try {\n    const response = await fetch(`${supabaseUrl}/functions/v1/canada-post-rates`, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify({ destinationPostalCode: normalized }),\n    });\n    if (!response.ok) return null;\n    const payload = await response.json().catch(() => ({}));\n    const rate = Array.isArray(payload?.rates) ? payload.rates[0] : null;\n    const price = Number(rate?.price);\n    if (!Number.isFinite(price) || price < 0) return null;\n    return {\n      price: roundMoney(price),\n      name: String(rate?.serviceName || "Canada Post Estimated Shipping"),\n      transitDays: Number(rate?.transitDays || 0) || null,\n    };\n  } catch (error) {\n    console.error("Canada Post estimate fallback", error);\n    return null;\n  }\n}\n\n'''
          if b.count(helper_marker) != 1:
              raise SystemExit('backend helper marker mismatch')
          b = b.replace(helper_marker, helper + helper_marker, 1)

          old = '''  const shippingRule = await getShippingRule(service, amount);\n  const shipping =\n    shippingMethod === "pickup" || freeShipping\n      ? 0\n      : roundMoney(Number(shippingRule?.price || 0));\n\n  const taxRule = await getTaxRule(service, customer?.province);\n'''
          new = '''  const shippingRule = await getShippingRule(service, amount);\n  const ruleShipping = roundMoney(Number(shippingRule?.price || 0));\n  const canadaPost = shippingMethod === "standard" && !freeShipping && ruleShipping > 0\n    ? await getCanadaPostEstimate(customer?.postalCode)\n    : null;\n  const shipping =\n    shippingMethod === "pickup" || freeShipping\n      ? 0\n      : (canadaPost?.price ?? ruleShipping);\n\n  const taxRule = await getTaxRule(service, customer?.province);\n'''
          if b.count(old) != 1:
              raise SystemExit(f'backend shipping block mismatch: {b.count(old)}')
          b = b.replace(old, new, 1)
          b = b.replace(
              '    shippingName: shippingMethod === "pickup" ? "Local Pickup" : shippingRule?.name || "Standard Shipping",\n',
              '    shippingName: shippingMethod === "pickup" ? "Local Pickup" : canadaPost?.name || shippingRule?.name || "Standard Shipping",\n',
              1
          )
          backend.write_text(b)
          PY

          git diff --check
          grep -q 'canada-post-rates' src/pages/Checkout.jsx
          grep -q 'getCanadaPostEstimate' supabase/functions/checkout/index.ts
          rm .github/workflows/apply-canada-post-checkout.yml

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Checkout.jsx supabase/functions/checkout/index.ts .github/workflows/apply-canada-post-checkout.yml
          git commit -m "feat: connect checkout to Canada Post estimated rates"
          git push
