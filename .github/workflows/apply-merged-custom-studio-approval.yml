name: Apply merged Custom Studio approval

on:
  push:
    paths:
      - ".github/workflows/apply-merged-custom-studio-approval.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate patcher syntax
        run: python -m py_compile scripts/apply_merge_custom_studio_approval.py

      - name: Apply scoped approval merge
        run: python scripts/apply_merge_custom_studio_approval.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify approval contracts
        run: node scripts/verify-custom-studio-v2-approval-refinement.mjs

      - name: Verify Custom Studio V2 contracts
        run: node scripts/verify-custom-studio-v2.mjs

      - name: Build production bundle
        run: npm run build

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit verified app changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No app changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx src/lib/customStudioV2State.js scripts/verify-custom-studio-v2-approval-refinement.mjs
          git commit -m "Merge Custom Studio finish and print approval"
          git push
