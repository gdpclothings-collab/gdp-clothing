name: Apply Seasonal Back Navigation Patch

on:
  push:
    branches:
      - fix/custom-studio-canonical-flow-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[seasonal-back-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/custom-studio-canonical-flow-20260913
          fetch-depth: 0

      - name: Apply Seasonal back-navigation patch
        run: node scripts/_patch_seasonal_back_navigation.mjs

      - name: Commit source patch
        run: |
          git config user.name "GDP Clothing Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx
          git commit -m "fix(custom-studio): restore Seasonal back navigation [seasonal-back-applied]"
          git push origin HEAD:fix/custom-studio-canonical-flow-20260913
