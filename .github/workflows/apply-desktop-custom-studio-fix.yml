name: Apply desktop Custom Studio fix

on:
  push:
    branches:
      - fix/desktop-back-artwork-canvas-fill

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Custom Studio patch
        run: python3 scripts/apply-desktop-custom-studio-fix.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "fix independent back artwork and fill bootleg preview"
          git push origin HEAD:fix/desktop-back-artwork-canvas-fill
