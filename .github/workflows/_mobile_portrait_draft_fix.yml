name: Mobile Portrait Draft Fix

on:
  push:
    branches:
      - fix/mobile-portrait-draft-resume-20260910
    paths:
      - .github/workflows/_mobile_portrait_draft_fix.yml
      - .github/scripts/apply_mobile_portrait_draft_fix.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-portrait-draft-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/mobile-portrait-draft-resume-20260910

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply source patch
        run: python .github/scripts/apply_mobile_portrait_draft_fix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Memorial workflow
        run: npm run test:memorial

      - name: Seasonal workflow
        run: node scripts/verify-seasonal-artwork.mjs

      - name: Production build
        run: npm run build

      - name: Commit verified source and remove temporary patch files
        shell: bash
        run: |
          rm -f .github/scripts/apply_mobile_portrait_draft_fix.py .github/workflows/_mobile_portrait_draft_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/CustomStudioAdvancedEditor.jsx src/pages/CustomStudio.jsx .github/scripts/apply_mobile_portrait_draft_fix.py .github/workflows/_mobile_portrait_draft_fix.yml
          git commit -m "Portrait mobile Touch Studio and explicit draft resume [mobile-portrait-draft-fixed]"
          git push origin HEAD:fix/mobile-portrait-draft-resume-20260910
