name: Touch Studio Reset Implementation

on:
  push:
    branches:
      - touch-studio-reset-controls-20260912

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: touch-studio-reset-controls-20260912
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reset controls
        run: node scripts/apply-touch-studio-reset.mjs

      - name: Verify reset contract
        run: node scripts/verify-touch-studio-reset.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Remove temporary implementation files
        run: |
          rm scripts/apply-touch-studio-reset.mjs
          rm .github/workflows/touch-studio-reset.yml

      - name: Commit implementation
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "Add scoped Touch Studio reset controls"
            git push origin HEAD:touch-studio-reset-controls-20260912
          fi
