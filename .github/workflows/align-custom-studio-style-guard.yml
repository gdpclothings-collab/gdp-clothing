name: Align Custom Studio style guard

on:
  push:
    branches:
      - fix/desktop-back-artwork-canvas-fill

permissions:
  contents: write

jobs:
  align-guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Preserve explicit fresh-session style guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/CustomStudio.jsx')
          text = path.read_text(encoding='utf-8')
          old = '  const activeStyleTemplate = styleTemplateForSide(previewSide);\n'
          new = '  const activeStyleTemplate = designStyle ? styleTemplateForSide(previewSide) : null;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one active style resolution, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: git diff --check
      - run: npm ci
      - run: npm run test:fresh-session
      - run: npm run typecheck
      - run: npm run build
      - name: Commit guard alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx
          git commit -m "preserve explicit style template guard"
          git push origin HEAD:fix/desktop-back-artwork-canvas-fill
