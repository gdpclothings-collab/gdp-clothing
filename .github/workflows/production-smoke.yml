name: GDP Clothing Production Smoke Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to test"
        required: false
        default: "https://gdpclothing.ca"

permissions:
  contents: read
  checks: read

concurrency:
  group: production-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.base_url || 'https://gdpclothing.ca' }}
      SMOKE_ARTIFACT_DIR: production-smoke-results
      PLAYWRIGHT_VERSION: "1.63.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect production-impacting changes
        if: github.event_name == 'push'
        id: production_changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${GITHUB_SHA}"

          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "$after" || true)"
          printf 'Changed files:\n%s\n' "$changed"

          # Workflow/docs/smoke-test-only edits do not require waiting for a new
          # Cloudflare production deployment. Everything else remains fail-safe.
          runtime_changed=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/*|docs/*|*.md|scripts/*smoke*.mjs)
                ;;
              *)
                runtime_changed=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
          echo "Production runtime changed: $runtime_changed"

      - name: Set up supported Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache Playwright Chromium
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Wait for Cloudflare production deployment
        if: github.event_name == 'push' && steps.production_changes.outputs.runtime_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
            status="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].status // "missing"')"
            conclusion="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].conclusion // ""')"
            echo "Cloudflare Pages check: status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then sleep 3; exit 0; fi
            if [[ "$status" == "completed" && -n "$conclusion" && "$conclusion" != "success" ]]; then exit 1; fi
            sleep 5
          done
          exit 1

      - name: Skip Cloudflare wait for non-runtime change
        if: github.event_name == 'push' && steps.production_changes.outputs.runtime_changed != 'true'
        run: echo "Fast smoke: no production runtime files changed; Cloudflare deployment wait skipped."

      - name: Run maintenance-aware production canary
        run: node scripts/production-smoke-v2.mjs

      - name: Run Custom Studio garment selection regression
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then
            echo "::notice title=Custom Studio garment regression skipped::Maintenance mode is active."
            exit 0
          fi
          node scripts/custom-studio-garment-smoke.mjs

      - name: Run Custom Studio hardening regression
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/custom-studio-hardening-smoke.mjs

      - name: Run safe storefront wiring canary
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/production-wiring-smoke.mjs

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-results
          if-no-files-found: ignore
          retention-days: 7
