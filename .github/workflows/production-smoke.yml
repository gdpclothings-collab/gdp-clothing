name: GDP Clothing Production Smoke Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production URL to test"
        required: false
        default: "https://gdpclothing.ca"
      expected_sha:
        description: "Exact merged commit SHA to verify"
        required: false
        default: ""

permissions:
  contents: read
  checks: read

concurrency:
  group: production-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_BASE_URL: ${{ github.event.inputs.base_url || 'https://gdpclothing.ca' }}
      SMOKE_EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.sha }}
      SMOKE_ARTIFACT_DIR: production-smoke-results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.expected_sha || github.sha }}
      - name: Verify smoke commit identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${SMOKE_EXPECTED_SHA}" ]]; then
            echo "Smoke checkout mismatch: expected ${SMOKE_EXPECTED_SHA}, got ${checked_out_sha}."
            exit 1
          fi
          echo "Production Smoke pinned to ${SMOKE_EXPECTED_SHA}."
      - name: Set up supported Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare production deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SMOKE_EXPECTED_SHA}/check-runs?per_page=100")"
            status="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].status // "missing"')"
            conclusion="$(printf '%s' "$payload" | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")][0].conclusion // ""')"
            echo "Cloudflare Pages check for ${SMOKE_EXPECTED_SHA}: status=${status} conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then sleep 3; exit 0; fi
            if [[ "$status" == "completed" && -n "$conclusion" && "$conclusion" != "success" ]]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Run maintenance-aware production canary
        run: node scripts/production-smoke-v2.mjs
      - name: Run read-only payment preflight
        if: success()
        run: node scripts/payment-preflight-smoke.mjs
      - name: Run Custom Studio garment selection regression
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then
            echo "::notice title=Custom Studio garment regression skipped::Maintenance mode is active."
            exit 0
          fi
          node scripts/custom-studio-garment-smoke.mjs
      - name: Run Custom Studio all-garment matrix
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then
            echo "::notice title=Custom Studio all-garment matrix skipped::Maintenance mode is active."
            exit 0
          fi
          node scripts/custom-studio-all-garment-smoke.mjs
      - name: Run Custom Studio variant accessibility smoke
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then
            echo "::notice title=Custom Studio variant accessibility smoke skipped::Maintenance mode is active."
            exit 0
          fi
          node scripts/custom-studio-variant-accessibility-smoke.mjs
      - name: Run Custom Studio hardening regression
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/custom-studio-hardening-smoke.mjs
      - name: Run Custom Studio responsive visual smoke
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then
            echo "::notice title=Custom Studio visual smoke skipped::Maintenance mode is active."
            exit 0
          fi
          node scripts/custom-studio-visual-smoke.mjs
      - name: Run Custom Studio Final Review live smoke
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/custom-studio-final-review-smoke.mjs
      - name: Run Custom Studio two-sided Final Review live smoke
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/custom-studio-final-review-two-sided-smoke.mjs
      - name: Run safe storefront wiring canary
        if: success()
        shell: bash
        run: |
          if [[ -f "${SMOKE_ARTIFACT_DIR}/report.json" ]] && jq -e '.mode == "maintenance"' "${SMOKE_ARTIFACT_DIR}/report.json" >/dev/null; then exit 0; fi
          node scripts/production-wiring-smoke.mjs
      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-results
          if-no-files-found: ignore
          retention-days: 7
