name: Apply Desktop Custom Studio Fix

on:
  push:
    branches:
      - fix/desktop-custom-studio-state-ui-20260911

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch desktop Custom Studio
        run: python scripts/apply_desktop_studio_fix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify desktop Custom Studio regression checks
        run: node scripts/verify-custom-studio-desktop.mjs

      - name: Build production app
        run: npm run build

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx src/components/storefront/DesktopGarmentSelectionFocus.jsx src/components/storefront/customStudioDesktop.css scripts/verify-custom-studio-desktop.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix desktop Custom Studio state and UI [desktop-studio-fix]"
          git push origin HEAD
