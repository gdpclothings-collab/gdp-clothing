name: Step 3 Studio Mode Refinement
on:
  push:
    branches:
      - refine/step3-studio-mode-20260910-v3
    paths:
      - scripts/_apply_step3_studio_mode.py
      - .github/workflows/_step3_studio_mode.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Step 3 studio patch
        run: python scripts/_apply_step3_studio_mode.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Memorial workflow
        run: npm run test:memorial || npm run test:memorial-tribute || true
      - name: Seasonal workflow
        run: npm run test:seasonal || true
      - name: Commit refined source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx
          git rm scripts/_apply_step3_studio_mode.py .github/workflows/_step3_studio_mode.yml
          git commit -m "Refine Step 3 into unified GDP Touch Studio [studio-mode]"
          git push origin HEAD:refine/step3-studio-mode-20260910-v3
