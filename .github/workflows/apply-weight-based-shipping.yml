name: Apply weight based shipping patch

on:
  push:
    branches:
      - feat/weight-based-shipping-20261001
    paths:
      - "scripts/apply-weight-based-shipping-patch.py"
      - ".github/workflows/apply-weight-based-shipping.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: python scripts/apply-weight-based-shipping-patch.py
      - name: Verify targeted weight regressions
        run: |
          git diff --check
          node scripts/verify-checkout-shipping-weight.mjs
          node scripts/verify-checkout-shipping-profiles.mjs
          node scripts/verify-checkout-shipping-zones.mjs
          node scripts/verify-checkout-terms-hotfix.mjs
      - name: Commit targeted patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/checkout/shipping-zone-rules.mjs supabase/functions/checkout/shipping-profile-rules.mjs supabase/functions/checkout/index.ts src/lib/shippingAdminApi.js src/components/admin/ShippingDeliveryManager.jsx src/pages/CheckoutTwoStep.jsx scripts/verify-checkout-shipping-weight.mjs .github/workflows/build-verification.yml
          git diff --cached --check
          git commit -m "feat(shipping): add weight based profile rates"
          git push origin HEAD:feat/weight-based-shipping-20261001
