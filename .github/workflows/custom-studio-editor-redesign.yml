name: Custom Studio Editor Redesign

on:
  push:
    branches:
      - custom-studio-editor-redesign-20260912

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: custom-studio-editor-redesign-20260912
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply redesign
        run: node scripts/apply-custom-studio-editor-redesign.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/CustomStudioAdvancedEditor.jsx src/pages/CustomStudio.jsx
          git commit -m "feat: redesign custom studio editing workspace [skip ci]"
          git push origin HEAD:custom-studio-editor-redesign-20260912
