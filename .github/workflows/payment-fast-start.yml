name: Payment Fast Start Verification

on:
  pull_request:
    paths:
      - "src/pages/CheckoutTwoStep.jsx"
      - "index.html"
      - "scripts/verify-payment-fast-start.mjs"
      - ".github/workflows/payment-fast-start.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify payment fast-start behavior
        run: node scripts/verify-payment-fast-start.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
