name: Fix Ready-to-Wear Quality Gate

on:
  push:
    branches:
      - feat/ready-to-wear-savings-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ready-to-wear-savings-foundation
          fetch-depth: 0
      - name: Apply quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib/cartPricing.js",
              "  getExactBundlePrice,\n  getReadyToWearPercent,\n  getVolumePercent,",
              "  getExactBundlePrice,\n  getVolumePercent,",
          )
          replace_once(
              "src/lib/cartPricing.js",
              "      const canStackWithSale = config.readyToWear.allowSaleStacking !== false || !saleActive;\n      const percent = canStackWithSale ? getReadyToWearPercent(config, quantity) : 0;",
              "      const canStackWithSale = config.readyToWear.allowSaleStacking !== false || !saleActive;\n      const readyToWearTier = (config.readyToWear.tiers || []).find((tier) => quantity >= Number(tier?.min || 0) && quantity <= Number(tier?.max || 0));\n      const percent = canStackWithSale ? Number(readyToWearTier?.percent || 0) : 0;",
          )
          replace_once(
              "src/pages/ProductDetail.jsx",
              'import { getReadyToWearPercent, getReadyToWearTiers, normalizeApparelPricing } from "@/lib/apparelPricing";',
              'import { normalizeApparelPricing } from "@/lib/apparelPricing";',
          )
          replace_once(
              "src/pages/ProductDetail.jsx",
              '''      .then(({ data }) => {\n        if (active && data?.apparel_pricing) setApparelPricing(normalizeApparelPricing(data.apparel_pricing));\n      })\n      .catch(() => {});''',
              '''      .then(\n        ({ data }) => {\n          if (active && data?.apparel_pricing) setApparelPricing(normalizeApparelPricing(data.apparel_pricing));\n        },\n        () => {},\n      );''',
          )
          replace_once(
              "src/pages/ProductDetail.jsx",
              '''  const readyToWearOfferEnabled = Boolean(isReadyToWear && apparelPricing.enabled && readyToWearPricing.enabled);\n  const readyToWearTiers = readyToWearOfferEnabled ? getReadyToWearTiers(apparelPricing) : [];\n  const readyToWearCanStackWithSale = !hasSale || readyToWearPricing.allowSaleStacking !== false;\n  const readyToWearPercent = readyToWearOfferEnabled && readyToWearCanStackWithSale\n    ? getReadyToWearPercent(apparelPricing, qty)\n    : 0;''',
              '''  const readyToWearOfferEnabled = Boolean(isReadyToWear && apparelPricing.enabled && readyToWearPricing.enabled);\n  const readyToWearTiers = readyToWearOfferEnabled ? (readyToWearPricing.tiers || []).map((tier) => ({ ...tier })) : [];\n  const readyToWearCanStackWithSale = !hasSale || readyToWearPricing.allowSaleStacking !== false;\n  const activeReadyToWearTier = readyToWearTiers.find((tier) => qty >= Number(tier?.min || 0) && qty <= Number(tier?.max || 0));\n  const readyToWearPercent = readyToWearOfferEnabled && readyToWearCanStackWithSale\n    ? Number(activeReadyToWearTier?.percent || 0)\n    : 0;''',
          )
          PY
          git diff --check
      - name: Commit quality fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cartPricing.js src/pages/ProductDetail.jsx
          git commit -m "Fix Ready-to-Wear pricing type checks"
          git push origin HEAD:feat/ready-to-wear-savings-foundation
