name: Live Weight Shipping Check

on:
  push:
    branches:
      - feat/weight-based-shipping-20261001
    paths:
      - ".github/workflows/live-weight-shipping-check.yml"

permissions:
  contents: read

jobs:
  live-weight-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production weight-aware checkout fallback
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://mcmancxsqlhxnjhlnfkz.supabase.co/functions/v1/checkout"
          product_id="0bbec10a-d3de-4500-bf7f-23bbfb24183a"

          paid="$(curl --fail-with-body --silent --show-error \
            -X POST -H 'content-type: application/json' \
            --data "{\"action\":\"checkoutConfig\",\"amount\":100,\"province\":\"Saskatchewan\",\"postalCode\":\"S7K 1J5\",\"shippingMethod\":\"standard\",\"freeShipping\":false,\"shippingItems\":[{\"productId\":\"${product_id}\",\"amount\":100,\"quantity\":2}]}" \
            "$endpoint")"
          printf '%s' "$paid" | jq -e '.configured == true and (.shipping == 12.99) and (.shippingProfileCount == 1) and (.shippingWeightGrams == null)' >/dev/null

          free="$(curl --fail-with-body --silent --show-error \
            -X POST -H 'content-type: application/json' \
            --data "{\"action\":\"checkoutConfig\",\"amount\":160,\"province\":\"Saskatchewan\",\"postalCode\":\"S7K 1J5\",\"shippingMethod\":\"standard\",\"freeShipping\":false,\"shippingItems\":[{\"productId\":\"${product_id}\",\"amount\":160,\"quantity\":2}]}" \
            "$endpoint")"
          printf '%s' "$free" | jq -e '.configured == true and (.shipping == 0) and (.shippingProfileCount == 1) and (.shippingWeightGrams == null)' >/dev/null

          echo "Production checkout v44 loaded weight-aware shipping and safely fell back for an unweighted product. No order or payment was created."
