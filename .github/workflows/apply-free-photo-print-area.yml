name: Apply scoped Custom Studio safe-boundary repair

on:
  push:
    branches:
      - repair/custom-studio-safe-20260920
    paths:
      - ".github/workflows/apply-free-photo-print-area.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/repair/custom-studio-safe-20260920'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate scoped patcher syntax
        run: python -m py_compile scripts/apply_custom_studio_safe_boundary_fix.py

      - name: Apply scoped Custom Studio patch
        run: python scripts/apply_custom_studio_safe_boundary_fix.py

      - name: Verify only the intended source file changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "src/pages/CustomStudio.jsx" || {
            echo "Unexpected working-tree changes:"
            printf '%s\n' "$changed"
            exit 1
          }
          git diff --check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Memorial Tribute contracts
        run: npm run test:memorial

      - name: Verify fresh-session state
        run: npm run test:fresh-session

      - name: Build production bundle
        run: npm run build

      - name: Restore temporary tooling and commit only verified app result
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/apply-free-photo-print-area.yml
          git rm scripts/apply_custom_studio_safe_boundary_fix.py
          git add src/pages/CustomStudio.jsx .github/workflows/apply-free-photo-print-area.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Custom Studio print-area approval gating [skip ci]"
          git push
