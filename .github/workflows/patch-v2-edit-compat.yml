name: Patch V2 edit compatibility

on:
  push:
    branches:
      - rebuild/custom-studio-v2-interaction-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/custom-studio-v2-interaction-parity
      - name: Apply exact compatibility patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/CustomStudioV2.jsx')
          text = page.read_text()
          replacements = [
            ("import { renderProtectedStudioV2PngAdvanced } from '@/lib/customStudioV2ProtectedProduction';", "import { renderProtectedStudioV2PngAdvanced } from '@/lib/customStudioV2ProtectedProduction';\nimport { refreshStudioV2DraftAssets } from '@/lib/customStudioV2Assets';"),
            ("      {product && <div className=\"grid gap-4 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-2\">", "      {product && <div className=\"grid gap-4 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-3\">"),
            ("        <div><div className=\"mb-2 text-xs font-black uppercase tracking-[.12em] text-slate-500\">Size</div><div className=\"flex flex-wrap gap-2\">{sizes.map((size) => <button key={size} type=\"button\" onClick={() => dispatch({ type: 'SET_SIZE', size })} className={`min-h-11 min-w-12 rounded-xl border-2 px-3 text-sm font-bold ${state.size === size ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700'}`}>{size}</button>)}</div></div>\n      </div>}", "        <div><div className=\"mb-2 text-xs font-black uppercase tracking-[.12em] text-slate-500\">Size</div><div className=\"flex flex-wrap gap-2\">{sizes.map((size) => <button key={size} type=\"button\" onClick={() => dispatch({ type: 'SET_SIZE', size })} className={`min-h-11 min-w-12 rounded-xl border-2 px-3 text-sm font-bold ${state.size === size ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-200 bg-white text-slate-700'}`}>{size}</button>)}</div></div>\n        <div><div className=\"mb-2 text-xs font-black uppercase tracking-[.12em] text-slate-500\">Quantity</div><div className=\"inline-flex min-h-11 items-center rounded-xl border-2 border-slate-200 bg-white\"><button type=\"button\" onClick={() => dispatch({ type: 'SET_QUANTITY', quantity: Math.max(1, Number(state.quantity || 1) - 1) })} disabled={Number(state.quantity || 1) <= 1} className=\"grid h-11 w-11 place-items-center text-lg font-black disabled:opacity-30\">−</button><input type=\"number\" min=\"1\" max=\"99\" value={state.quantity} onChange={(event) => dispatch({ type: 'SET_QUANTITY', quantity: Math.min(99, Math.max(1, Number(event.target.value || 1))) })} className=\"h-11 w-14 border-x border-slate-200 text-center text-sm font-black outline-none\" /><button type=\"button\" onClick={() => dispatch({ type: 'SET_QUANTITY', quantity: Math.min(99, Number(state.quantity || 1) + 1) })} disabled={Number(state.quantity || 1) >= 99} className=\"grid h-11 w-11 place-items-center text-lg font-black disabled:opacity-30\">+</button></div></div>\n      </div>}"),
            ("  useEffect(() => {\n    let active = true;\n    setLoading(true);", "  useEffect(() => {\n    const draft = location.state?.studioV2Draft;\n    if (!draft?.state || draft.version !== 1) return undefined;\n    let active = true;\n    refreshStudioV2DraftAssets(draft.state)\n      .then((refreshed) => {\n        if (!active || !refreshed) return;\n        setState({ ...refreshed, step: 'customize', approval: { ...(refreshed.approval || {}), finalDesignApproved: false } });\n      })\n      .catch(() => { /* Stable paths remain available; final rendering will surface an actionable error if refresh fails. */ });\n    return () => { active = false; };\n  }, [location.state]);\n\n  useEffect(() => {\n    let active = true;\n    setLoading(true);"),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'CustomStudioV2 expected one match, found {count}: {old[:120]!r}')
            text = text.replace(old, new)
          page.write_text(text)

          app = Path('src/App.jsx')
          text = app.read_text()
          old = '            <Route path="/custom-studio" element={<CustomStudio />} />\n            <Route path="/design" element={<CustomStudio />} />\n            <Route path="/custom-studio-v2" element={<CustomStudioV2 />} />'
          new = '            <Route path="/custom-studio" element={<CustomStudio />} />\n            <Route path="/design" element={<CustomStudio />} />\n            <Route path="/custom-studio-legacy" element={<CustomStudio />} />\n            <Route path="/custom-studio-v2" element={<CustomStudioV2 />} />'
          if text.count(old) != 1:
            raise SystemExit('App route anchor mismatch')
          app.write_text(text.replace(old, new))

          cart = Path('src/pages/CartV2.jsx')
          text = cart.read_text()
          old = '''  const editCustomDesign = (item) => {\n    const canRestore = beginStudioCartEdit(item);\n    const seasonalDraft = item.seasonalDraft || item.studioDraft?.seasonalDraft || null;\n    if (!canRestore && !seasonalDraft) return;\n    navigate(`/custom-studio?product=${encodeURIComponent(item.productId)}&color=${encodeURIComponent(item.color || "")}&size=${encodeURIComponent(item.size || "")}`, {\n      state: { seasonalDraft, editCartKey: item.key },\n    });\n  };'''
          new = '''  const editCustomDesign = (item) => {\n    if (item.studioV2Draft?.version === 1 && item.studioV2Draft?.state) {\n      navigate('/custom-studio-v2', { state: { studioV2Draft: item.studioV2Draft, editCartKey: item.key } });\n      return;\n    }\n    const canRestore = beginStudioCartEdit(item);\n    const seasonalDraft = item.seasonalDraft || item.studioDraft?.seasonalDraft || null;\n    if (!canRestore && !seasonalDraft) return;\n    navigate(`/custom-studio-legacy?product=${encodeURIComponent(item.productId)}&color=${encodeURIComponent(item.color || "")}&size=${encodeURIComponent(item.size || "")}`, {\n      state: { seasonalDraft, editCartKey: item.key },\n    });\n  };'''
          if text.count(old) != 1:
            raise SystemExit('Cart edit anchor mismatch')
          text = text.replace(old, new)
          old = 'const canEditCustom = Boolean(item.isCustom && !item.isDtf && (item.studioDraft || item.seasonalDraft));'
          new = 'const canEditCustom = Boolean(item.isCustom && !item.isDtf && (item.studioV2Draft || item.studioDraft || item.seasonalDraft));'
          if text.count(old) != 1:
            raise SystemExit('Cart canEdit anchor mismatch')
          cart.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-v2-edit-compat.yml
      - name: Commit compatibility changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx src/pages/CartV2.jsx src/App.jsx .github/workflows/patch-v2-edit-compat.yml
          git commit -m "Preserve legacy and V2 edit flows for cutover"
          git push origin HEAD:rebuild/custom-studio-v2-interaction-parity
