name: Apply Touch Studio source patch

on:
  push:
    branches:
      - fix/custom-studio-touch-studio-pass
    paths:
      - .github/workflows/touch-studio-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/custom-studio-touch-studio-pass
          fetch-depth: 0

      - name: Apply guarded source patch
        run: |
          node scripts/apply-touch-studio-source-patch.mjs
          # The GitHub Actions token may not update workflow files. Source
          # changes are committed here; the connected GitHub integration adds
          # the verification step separately.
          git checkout -- .github/workflows/build-verification.yml

      - name: Verify patch diff
        run: |
          git diff --check
          git status --short

      - name: Commit patched source
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/StoreNav.jsx
          git commit -m "fix: refine GDP Touch Studio interactions and layout"
          git push origin HEAD:fix/custom-studio-touch-studio-pass
