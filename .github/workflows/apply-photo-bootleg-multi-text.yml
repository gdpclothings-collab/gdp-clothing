name: Harden Photo Bootleg multi-text implementation

on:
  push:
    paths:
      - ".github/workflows/apply-photo-bootleg-multi-text.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate hardening script
        run: node --check scripts/harden-photo-bootleg-multi-text.mjs

      - name: Harden multi-text implementation
        run: node scripts/harden-photo-bootleg-multi-text.mjs

      - name: Verify Photo Bootleg contracts
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hardening changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "Harden Photo Bootleg multi-text template switching"
          git push
