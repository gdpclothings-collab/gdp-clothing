name: GDP Cart Dependency Security Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cart-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-production-audit:
    name: Check production dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on high or critical runtime advisories
        run: npm audit --omit=dev --audit-level=high
