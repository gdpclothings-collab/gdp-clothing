name: Discount Live Contract Test

on:
  push:
    branches:
      - fix/discount-scope-wiring
    paths:
      - .github/workflows/discount-live-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test production discount contract
        shell: bash
        env:
          ENDPOINT: https://mcmancxsqlhxnjhlnfkz.supabase.co/functions/v1/checkout
          API_KEY: sb_publishable_K0FttoPALmJZ33RMTxBOIg_UbHDlpl7
          TARGET_PRODUCT: a2735714-fe01-476b-a4ee-561ac9358261
          WRONG_PRODUCT: 56d38127-fb7d-4bc1-a6f6-3ac5f92824aa
        run: |
          set -euo pipefail
          post() {
            curl --fail --silent --show-error \
              -H "apikey: ${API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Origin: https://gdpclothing.ca" \
              --data "$1" \
              "$ENDPOINT"
          }

          PROMO=$(post "{\"action\":\"getProductPromotions\",\"productId\":\"${TARGET_PRODUCT}\"}")
          TARGET=$(post "{\"action\":\"validateCoupon\",\"code\":\"50OFF\",\"purchase\":39.99,\"items\":[{\"productId\":\"${TARGET_PRODUCT}\",\"amount\":39.99}]}")
          WRONG=$(post "{\"action\":\"validateCoupon\",\"code\":\"50OFF\",\"purchase\":59.99,\"items\":[{\"productId\":\"${WRONG_PRODUCT}\",\"amount\":59.99}]}")
          MIXED=$(post "{\"action\":\"validateCoupon\",\"code\":\"50OFF\",\"purchase\":99.98,\"items\":[{\"productId\":\"${TARGET_PRODUCT}\",\"amount\":39.99},{\"productId\":\"${WRONG_PRODUCT}\",\"amount\":59.99}]}")

          export PROMO TARGET WRONG MIXED
          python - <<'PY'
          import json, os, math
          promo = json.loads(os.environ['PROMO'])
          target = json.loads(os.environ['TARGET'])
          wrong = json.loads(os.environ['WRONG'])
          mixed = json.loads(os.environ['MIXED'])

          promotions = promo.get('promotions') or []
          assert any(p.get('code') == '50OFF' and p.get('type') == 'percentage' and float(p.get('value', 0)) == 50 for p in promotions), promo

          assert target.get('active') is True, target
          assert target.get('code') == '50OFF', target
          assert math.isclose(float(target.get('eligibleSubtotal', -1)), 39.99, abs_tol=0.01), target
          assert math.isclose(float(target.get('amount', -1)), 20.00, abs_tol=0.01), target

          assert wrong.get('active') is False, wrong
          assert wrong.get('reason') == 'not_applicable', wrong
          assert math.isclose(float(wrong.get('eligibleSubtotal', -1)), 0.00, abs_tol=0.01), wrong

          assert mixed.get('active') is True, mixed
          assert math.isclose(float(mixed.get('eligibleSubtotal', -1)), 39.99, abs_tol=0.01), mixed
          assert math.isclose(float(mixed.get('amount', -1)), 20.00, abs_tol=0.01), mixed

          print('PROMOTION_VISIBILITY=PASS')
          print('TARGET_PRODUCT_SCOPE=PASS')
          print('WRONG_PRODUCT_REJECTION=PASS')
          print('MIXED_CART_SCOPE=PASS')
          print('DISCOUNT_AMOUNT_39_99=20.00')
          PY
