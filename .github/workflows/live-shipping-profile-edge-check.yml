name: Live Shipping Profile Edge Check

on:
  push:
    branches:
      - feat/product-shipping-profiles-20261001
    paths:
      - ".github/workflows/live-shipping-profile-edge-check.yml"

permissions:
  contents: read

jobs:
  shipping-profile-live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production profile-aware checkout config
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://mcmancxsqlhxnjhlnfkz.supabase.co/functions/v1/checkout"
          product_id="0bbec10a-d3de-4500-bf7f-23bbfb24183a"

          paid="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            --data "{\"action\":\"checkoutConfig\",\"amount\":100,\"province\":\"Saskatchewan\",\"postalCode\":\"S7K 1J5\",\"shippingMethod\":\"standard\",\"freeShipping\":false,\"shippingItems\":[{\"productId\":\"${product_id}\",\"amount\":100}]}" \
            "$endpoint")"
          printf '%s' "$paid" | jq -e '.configured == true and (.shipping == 12.99) and (.shippingProfileCount == 1) and (.shippingMethod == "standard")' >/dev/null

          free="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            --data "{\"action\":\"checkoutConfig\",\"amount\":160,\"province\":\"Saskatchewan\",\"postalCode\":\"S7K 1J5\",\"shippingMethod\":\"standard\",\"freeShipping\":false,\"shippingItems\":[{\"productId\":\"${product_id}\",\"amount\":160}]}" \
            "$endpoint")"
          printf '%s' "$free" | jq -e '.configured == true and (.shipping == 0) and (.shippingProfileCount == 1) and (.shippingMethod == "standard")' >/dev/null

          echo "Production checkout v43 profile-aware quote path returned expected general paid/free rates with one shipping profile group."
