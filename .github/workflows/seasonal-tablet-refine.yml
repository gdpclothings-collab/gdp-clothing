name: Seasonal tablet refinement

on:
  push:
    branches:
      - feat/seasonal-tablet-workspace-v2

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seasonal-tablet-workspace-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply tablet workspace refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/storefront/SeasonalStudioLayered.jsx')
          source = path.read_text()
          if 'tabletControlsOpen' in source:
              print('Tablet refinement already applied.')
          else:
              replacements = [
                  (
                      "  const [capturing, setCapturing] = useState(false);\n  const [, setHistoryVersion] = useState(0);",
                      "  const [capturing, setCapturing] = useState(false);\n  const [tabletControlsOpen, setTabletControlsOpen] = useState(true);\n  const [, setHistoryVersion] = useState(0);",
                  ),
                  (
                      "<section role=\"status\" aria-label=\"Loading seasonal designs\" className=\"grid animate-pulse items-start gap-4 xl:grid-cols-[minmax(300px,.78fr)_minmax(520px,1.3fr)_minmax(285px,.72fr)] xl:gap-5\">",
                      "<section role=\"status\" aria-label=\"Loading seasonal designs\" className=\"grid animate-pulse items-start gap-4 lg:grid-cols-[minmax(0,1.35fr)_minmax(300px,.65fr)] lg:gap-5 xl:grid-cols-[minmax(300px,.78fr)_minmax(520px,1.3fr)_minmax(285px,.72fr)]\">",
                  ),
                  (
                      "<div className=\"rounded-3xl border border-[#DCE3EA] bg-white/85 p-5\"><div className=\"h-3 w-24 rounded bg-slate-200\" />",
                      "<div className=\"rounded-3xl border border-[#DCE3EA] bg-white/85 p-5 lg:col-span-2 xl:col-span-1 xl:col-start-1 xl:row-start-1\"><div className=\"h-3 w-24 rounded bg-slate-200\" />",
                  ),
                  (
                      "<div className=\"rounded-3xl border border-[#CDD7E0] bg-white p-3 shadow-[0_24px_60px_rgba(23,50,77,.08)] xl:sticky xl:top-4\">",
                      "<div className=\"rounded-3xl border border-[#CDD7E0] bg-white p-3 shadow-[0_24px_60px_rgba(23,50,77,.08)] lg:col-start-1 lg:row-start-2 lg:sticky lg:top-4 xl:col-start-2 xl:row-start-1\">",
                  ),
                  (
                      "<div className=\"space-y-4 rounded-3xl border border-[#DCE3EA] bg-white/85 p-5\">{Array.from({ length: 5 })",
                      "<div className=\"space-y-4 rounded-3xl border border-[#DCE3EA] bg-white/85 p-5 lg:col-start-2 lg:row-start-2 lg:sticky lg:top-4 xl:col-start-3 xl:row-start-1\">{Array.from({ length: 5 })",
                  ),
                  (
                      "          <div className=\"grid min-w-0 w-full items-start gap-4 xl:grid-cols-[minmax(300px,.78fr)_minmax(560px,1.42fr)_minmax(320px,.72fr)] xl:gap-5\">",
                      "          <div className={`grid min-w-0 w-full items-start gap-4 lg:gap-5 ${tabletControlsOpen ? 'lg:grid-cols-[minmax(0,1.35fr)_minmax(300px,.65fr)]' : 'lg:grid-cols-[minmax(0,1fr)_72px]'} xl:grid-cols-[minmax(300px,.78fr)_minmax(560px,1.42fr)_minmax(320px,.72fr)]`}>",
                  ),
                  (
                      "<section aria-label=\"Choose seasonal artwork\" className=\"order-1 min-w-0 w-full rounded-3xl border border-[#DCE3EA] bg-white/90 p-4 shadow-[0_14px_40px_rgba(23,50,77,.07)] lg:p-5 xl:sticky xl:top-4 xl:flex xl:max-h-[calc(100dvh-2rem)] xl:flex-col xl:overflow-hidden\">",
                      "<section aria-label=\"Choose seasonal artwork\" className=\"order-1 min-w-0 w-full rounded-3xl border border-[#DCE3EA] bg-white/90 p-4 shadow-[0_14px_40px_rgba(23,50,77,.07)] lg:col-span-2 lg:row-start-1 lg:p-5 xl:col-span-1 xl:col-start-1 xl:row-start-1 xl:sticky xl:top-4 xl:flex xl:max-h-[calc(100dvh-2rem)] xl:flex-col xl:overflow-hidden\">",
                  ),
                  (
                      "<section ref={previewSectionRef} aria-label=\"Garment preview\" className=\"order-2 min-w-0 w-full scroll-mt-20 xl:sticky xl:top-4\">",
                      "<section ref={previewSectionRef} aria-label=\"Garment preview\" className=\"order-2 min-w-0 w-full scroll-mt-20 lg:col-start-1 lg:row-start-2 lg:sticky lg:top-4 xl:col-start-2 xl:row-start-1\">",
                  ),
                  (
                      "shadow-sm xl:hidden\"><button type=\"button\" onClick={onBack}",
                      "shadow-sm lg:hidden\"><button type=\"button\" onClick={onBack}",
                  ),
                  (
                      "<section ref={controlsSectionRef} aria-label=\"Garment and artwork controls\" className=\"order-3 min-w-0 w-full scroll-mt-20 space-y-4 xl:sticky xl:top-4 xl:max-h-[calc(100dvh-2rem)] xl:overflow-y-auto xl:overscroll-contain xl:pr-1\">",
                      "<section ref={controlsSectionRef} aria-label=\"Garment and artwork controls\" className=\"order-3 min-w-0 w-full scroll-mt-20 space-y-3 lg:col-start-2 lg:row-start-2 lg:sticky lg:top-4 lg:max-h-[calc(100dvh-2rem)] lg:overflow-y-auto lg:overscroll-contain lg:pr-1 xl:col-start-3 xl:row-start-1\">\n              <button type=\"button\" onClick={() => setTabletControlsOpen((value) => !value)} aria-expanded={tabletControlsOpen} aria-controls=\"seasonal-tablet-controls\" className=\"hidden min-h-12 w-full items-center justify-center gap-1.5 rounded-2xl border border-[#CDD7E0] bg-white px-2 text-[#17324D] shadow-sm lg:flex xl:hidden\"><span className=\"text-[10px] font-bold uppercase tracking-wide\">{tabletControlsOpen ? 'Hide' : 'Open'}</span><ChevronDown size={15} className={`transition ${tabletControlsOpen ? 'rotate-180' : '-rotate-90'}`} /></button>\n              <div id=\"seasonal-tablet-controls\" className={`${tabletControlsOpen ? '' : 'lg:hidden'} space-y-4 xl:block`}>",
                  ),
                  (
                      "              {layers.length > 0 && <div className=\"space-y-3 rounded-3xl border border-[#DCE3EA] bg-white/90 p-4 shadow-[0_14px_40px_rgba(23,50,77,.07)]\">{priceVisibility !== 'hidden' && <p className=\"rounded-xl bg-[#F3F6F8] p-3 text-xs text-[#52616F]\">Front print · ${Number(unitPrice).toFixed(2)} CAD each{priceVisibility === 'total' && ` · $${designSubtotal.toFixed(2)} CAD total`} before shipping and tax.</p>}<label className=\"flex items-start gap-2 text-sm leading-relaxed text-[#46596A]\"><input type=\"checkbox\" checked={approved} onChange={(event) => { setApproved(event.target.checked); setReviewMode(false); if (event.target.checked) { setShowGuides(false); setShowMeasurements(false); } }} className=\"mt-1\" /><span>I approve the exact garment preview, artwork layers, overlap, order, sizes, rotations and placements. I understand this composite will be locked and printed after successful payment.</span></label><button disabled={!approved || !visibleResolvedLayers.length} onClick={() => { setShowGuides(false); setShowMeasurements(false); setReviewMode(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className=\"w-full rounded-xl bg-[#17324D] px-6 py-3.5 font-bold text-white shadow-lg transition hover:bg-[#234766] disabled:opacity-40\">Review design</button></div>}\n            </section>",
                      "              {layers.length > 0 && <div className=\"space-y-3 rounded-3xl border border-[#DCE3EA] bg-white/90 p-4 shadow-[0_14px_40px_rgba(23,50,77,.07)]\">{priceVisibility !== 'hidden' && <p className=\"rounded-xl bg-[#F3F6F8] p-3 text-xs text-[#52616F]\">Front print · ${Number(unitPrice).toFixed(2)} CAD each{priceVisibility === 'total' && ` · $${designSubtotal.toFixed(2)} CAD total`} before shipping and tax.</p>}<label className=\"flex items-start gap-2 text-sm leading-relaxed text-[#46596A]\"><input type=\"checkbox\" checked={approved} onChange={(event) => { setApproved(event.target.checked); setReviewMode(false); if (event.target.checked) { setShowGuides(false); setShowMeasurements(false); } }} className=\"mt-1\" /><span>I approve the exact garment preview, artwork layers, overlap, order, sizes, rotations and placements. I understand this composite will be locked and printed after successful payment.</span></label><button disabled={!approved || !visibleResolvedLayers.length} onClick={() => { setShowGuides(false); setShowMeasurements(false); setReviewMode(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className=\"w-full rounded-xl bg-[#17324D] px-6 py-3.5 font-bold text-white shadow-lg transition hover:bg-[#234766] disabled:opacity-40\">Review design</button></div>}\n              </div>\n            </section>",
                  ),
              ]
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit(f'Expected Seasonal Studio fragment not found:\n{old[:180]}')
                  source = source.replace(old, new, 1)
              path.write_text(source)
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit tablet refinement
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/SeasonalStudioLayered.jsx
          git commit -m "Refine Seasonal Lab tablet workspace"
          git push origin HEAD:feat/seasonal-tablet-workspace-v2
