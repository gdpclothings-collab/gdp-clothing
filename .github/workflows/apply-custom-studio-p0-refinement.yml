              '''    gesture.moved = true;
            onPatchLayer(gesture.id, patch, { history: false });
          };
          ''',
              '''    if (Object.prototype.hasOwnProperty.call(patch, "x") && Object.prototype.hasOwnProperty.call(patch, "y")) {
