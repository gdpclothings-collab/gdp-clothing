name: Apply Custom Studio P0 Refinement

on:
  push:
    branches:
      - refine-custom-studio-p0
    paths:
      - .github/workflows/apply-custom-studio-p0-refinement.yml

permissions:
  contents: write

jobs:
  guarded-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: refine-custom-studio-p0
          fetch-depth: 0

      - name: Apply exact guarded patches
        run: python3 scripts/apply-custom-studio-p0-refinement.py

      - name: Preserve JS type safety for draft serialization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/pages/CustomStudio.jsx")
          text = path.read_text()
          old = '  const safePhoto = { ...(photo || {}) };\n  delete safePhoto.sourceFile;'
          new = '  const safePhoto = /** @type {any} */ ({ ...(photo || {}) });\n  delete safePhoto.sourceFile;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"draft serializer type guard expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Memorial regression
        run: npm run test:memorial

      - name: Fresh session regression
        run: npm run test:fresh-session

      - name: Product variant regression
        run: npm run test:product-variants

      - name: DTF nesting regression
        run: npm run test:dtf-nesting

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git rm .github/workflows/apply-custom-studio-p0-refinement.yml scripts/apply-custom-studio-p0-refinement.py
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx
          git commit -m "Refine Custom Studio autosave snapping and photo feedback"
          git push origin HEAD:refine-custom-studio-p0
