name: Apply background removal graceful fallback

on:
  push:
    branches:
      - fix/background-removal-graceful-fallback

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/background-removal-graceful-fallback
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated editor patch
        run: node scripts/apply-background-removal-graceful-fallback.mjs
      - name: Verify intended markers
        run: |
          grep -q 'data-gdp-background-removal-fallback="true"' src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
          grep -q 'Retry Background Removal' src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
          grep -q 'sourcePhotoFilesRef' src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx
          git commit -m "fix: preserve original photo when background removal fails"
          git push origin HEAD:fix/background-removal-graceful-fallback
