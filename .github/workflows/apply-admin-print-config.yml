# One-time branch integration runner; remove before merging.
name: Apply Admin Print Configuration Integration

on:
  push:
    branches:
      - feat/admin-print-configuration
    paths:
      - .github/workflows/apply-admin-print-config.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-print-configuration
          fetch-depth: 0

      - name: Integrate dedicated Print Configuration panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/ProductsModule.jsx')
          text = path.read_text()

          import_anchor = 'import { resolveColorSwatch } from "@/lib/colorSwatches";\n'
          import_line = 'import PrintConfigurationPanel from "@/components/admin/PrintConfigurationPanel";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          function_start = text.find('  const setPrintGuideValue =')
          function_end = text.find('  const toggleCollection =', function_start)
          if function_start == -1 or function_end == -1:
              raise SystemExit('Legacy print-guide setter block not found')
          text = text[:function_start] + text[function_end:]

          for declaration in [
              '  const customStudioFrontGuide = form.customization?.preview?.printGuide?.front || {};\n',
              '  const customStudioFrontSizeScaling = customStudioFrontGuide.sizeScalingEnabled !== false;\n',
              '  const customStudioBackGuide = form.customization?.preview?.printGuide?.back || {};\n',
              '  const customStudioBackSizeScaling = customStudioBackGuide.sizeScalingEnabled !== false;\n',
          ]:
              if declaration not in text:
                  raise SystemExit(f'Expected legacy declaration missing: {declaration.strip()}')
              text = text.replace(declaration, '', 1)

          block_start = '                  <div className="rounded-lg border border-[#cfd9e3] bg-[#f7fafc] p-3">'
          front_marker = '<div className="text-xs font-semibold text-[#17324D]">Front print production guide</div>'
          back_area_anchor = '                   <div className="rounded-lg border border-[#e2e2e2] bg-[#fafafa] p-3">\n                    <div className="text-xs font-semibold">Back printable area</div>'

          front_marker_at = text.find(front_marker)
          if front_marker_at == -1:
              raise SystemExit('Front legacy production-guide block not found')
          front_start = text.rfind(block_start, 0, front_marker_at)
          front_end = text.find(back_area_anchor, front_marker_at)
          if front_start == -1 or front_end == -1:
              raise SystemExit('Front production-guide boundaries not found')
          text = text[:front_start] + text[front_end:]

          back_marker = '<div className="text-xs font-semibold text-[#17324D]">Back print production guide</div>'
          tip_anchor = '                   <div className="text-[10px] leading-4 text-[#888]">\n                    Tip: keep the guide inside the real printable chest/back area.'
          back_marker_at = text.find(back_marker)
          if back_marker_at == -1:
              raise SystemExit('Back legacy production-guide block not found')
          back_start = text.rfind(block_start, 0, back_marker_at)
          back_end = text.find(tip_anchor, back_marker_at)
          if back_start == -1 or back_end == -1:
              raise SystemExit('Back production-guide boundaries not found')
          text = text[:back_start] + text[back_end:]

          front_area_anchor = '                   <div className="rounded-lg border border-[#e2e2e2] bg-[#fafafa] p-3">\n                    <div className="text-xs font-semibold">Front printable area</div>'
          panel = '''                  <PrintConfigurationPanel\n                    form={form}\n                    setForm={setForm}\n                    sizes={customStudioSizes}\n                  />\n\n'''
          if front_area_anchor not in text:
              raise SystemExit('Front printable-area anchor not found')
          text = text.replace(front_area_anchor, panel + front_area_anchor, 1)

          required = [
              'PrintConfigurationPanel',
              'sizes={customStudioSizes}',
              'Front printable area',
              'Back printable area',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Patched editor missing required token: {token}')

          forbidden = [
              'Front print production guide',
              'Back print production guide',
              'const setPrintGuideValue',
              'const setSizePrintGuideValue',
              'customStudioFrontSizeScaling',
              'customStudioBackSizeScaling',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Legacy duplicate remains after patch: {token}')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify Print Configuration wiring
        run: node scripts/verify-admin-print-configuration.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit focused integration
        shell: bash
        run: |
          if git diff --quiet -- src/components/admin/ProductsModule.jsx; then
            echo "No Product editor patch to commit"
            exit 1
          fi
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add src/components/admin/ProductsModule.jsx
          git commit -m "Wire Print Configuration into product editor"
          git fetch origin feat/admin-print-configuration
          git rebase origin/feat/admin-print-configuration
          git push origin HEAD:feat/admin-print-configuration
