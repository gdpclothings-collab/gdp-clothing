name: Verify checkout terms hotfix
on:
  pull_request:
    paths:
      - 'src/pages/CheckoutTwoStep.jsx'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
