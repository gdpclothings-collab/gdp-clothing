name: Verify checkout regression
on:
  pull_request:
    paths:
      - 'src/pages/CheckoutTwoStep.jsx'
      - 'src/pages/OrderConfirmation.jsx'
      - 'src/lib/paymentApi.js'
      - 'src/lib/adminCustomStudioApi.js'
      - 'src/lib/customStudioPaymentGate.js'
      - 'src/components/admin/CustomStudioAdminModule.jsx'
      - 'supabase/functions/payment-session/index.ts'
      - 'supabase/functions/stripe-webhook/index.ts'
      - 'scripts/verify-checkout-terms-hotfix.mjs'
      - 'scripts/verify-gdp-test-checkout-v1.mjs'
      - '.github/workflows/verify-checkout-regression.yml'
jobs:
  checkout-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-checkout-terms-hotfix.mjs
      - run: node scripts/verify-gdp-test-checkout-v1.mjs
      - run: node scripts/verify-payment-confirmation-authority.mjs
      - run: npm run build
