name: Verify checkout regression
on:
  pull_request:
    paths:
      - 'src/pages/CheckoutTwoStep.jsx'
      - 'scripts/verify-checkout-terms-hotfix.mjs'
      - 'supabase/functions/checkout/index.ts'
      - 'supabase/functions/checkout-gateway/index.ts'
      - 'tests/checkout-gateway-email-alignment.test.mjs'
      - '.github/workflows/verify-checkout-regression.yml'
jobs:
  checkout-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-checkout-terms-hotfix.mjs
      - run: node --test tests/checkout-gateway-email-alignment.test.mjs
      - run: npm run build