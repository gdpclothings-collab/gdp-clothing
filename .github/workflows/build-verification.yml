name: GDP Clothing Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify no active Base44 runtime dependency
        shell: bash
        run: |
          if grep -RniE 'base44Client|@base44/|@base44"|https://base44\.app|media\.base44\.com' src package.json vite.config.js; then
            echo "Active Base44 runtime reference detected."
            exit 1
          fi
          echo "No active Base44 runtime references found."

      - name: Verify test harness syntax
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done

      - name: Run dependency-free regression checks
        run: |
          node scripts/verify-custom-studio-shell-architecture.mjs
          node scripts/verify-custom-studio-layout-refinement.mjs
          node scripts/verify-custom-studio-touch-studio.mjs
          node scripts/verify-custom-studio-mobile-refinement.mjs
          node scripts/verify-custom-studio-mobile-regression-repair.mjs
          node scripts/verify-custom-studio-mobile-editor-safety.mjs
          node scripts/verify-custom-studio-garment-interactions.mjs
          node scripts/verify-custom-studio-garment-info.mjs
          node scripts/verify-custom-studio-garment-layout-refinement.mjs
          node scripts/verify-custom-studio-focused-garment-v2.mjs
          node scripts/verify-custom-studio-footer.mjs
          node scripts/verify-custom-studio-garment-preview.mjs
          node scripts/verify-custom-order-guide-visibility.mjs
          node scripts/verify-custom-studio-hardening.mjs
          node scripts/verify-custom-studio-canonical-flow.mjs
          node scripts/verify-custom-studio-v2.mjs
          node scripts/verify-custom-studio-v2-approval-refinement.mjs
          node scripts/verify-seasonal-v2-loading-stability.mjs
          node scripts/verify-seasonal-v2-explicit-add-artwork.mjs
          node scripts/verify-admin-print-configuration.mjs
          node scripts/verify-custom-studio-print-guides.mjs
          node scripts/verify-custom-studio-print-pipeline.mjs
          node scripts/verify-cart-pricing.mjs
          node scripts/verify-seasonal-artwork.mjs
          node scripts/verify-photo-bootleg-desktop.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run package regression checks
        run: |
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial

      - name: Build production app
        run: npm run build
