name: GDP Clothing Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standalone-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify no active Base44 runtime dependency
        shell: bash
        run: |
          if grep -RniE 'base44Client|@base44/|@base44"|https://base44\.app|media\.base44\.com' src package.json vite.config.js; then
            echo "Active Base44 runtime reference detected."
            exit 1
          fi
          echo "No active Base44 runtime references found."

      - name: Verify test harness syntax
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done

      - name: Run dependency-free regression checks
        run: |
          node scripts/verify-custom-studio-shell-architecture.mjs
          node scripts/verify-custom-studio-layout-refinement.mjs
          node scripts/verify-custom-studio-touch-studio.mjs
          node scripts/verify-custom-studio-mobile-refinement.mjs
          node scripts/verify-custom-studio-mobile-regression-repair.mjs
          node scripts/verify-custom-studio-mobile-editor-safety.mjs
          node scripts/verify-custom-studio-garment-interactions.mjs
          node scripts/verify-custom-studio-garment-info.mjs
          node scripts/verify-custom-studio-variant-accessibility.mjs
          node scripts/verify-custom-studio-garment-layout-refinement.mjs
          node scripts/verify-custom-studio-focused-garment-v2.mjs
          node scripts/verify-custom-studio-final-review-preview.mjs
          node scripts/verify-custom-studio-footer.mjs
          node scripts/verify-custom-studio-garment-preview.mjs
          node scripts/verify-custom-order-guide-visibility.mjs
          node scripts/verify-custom-studio-hardening.mjs
          node scripts/verify-custom-studio-canonical-flow.mjs
          node scripts/verify-custom-studio-v2.mjs
          node scripts/verify-custom-studio-premium-text-styles.mjs
          node --test tests/studio-my-designs.test.mjs
          node --test tests/studio-working-draft-recovery.test.mjs
          node --test tests/studio-v2-browser-history.test.mjs
          node --test tests/studio-v2-navigation-polish.test.mjs
          node --test tests/studio-v2-scroll-restoration.test.mjs
          node scripts/verify-custom-studio-premium-presentation.mjs
          node scripts/verify-custom-studio-v2-approval-refinement.mjs
          node scripts/verify-custom-studio-v2-unified-approval.mjs
          node scripts/verify-custom-studio-upload-artwork-metrics.mjs
          node --test tests/studio-smart-image-quality.test.mjs
          node --test tests/studio-smart-enhancer-polish.test.mjs
          node scripts/verify-seasonal-v2-loading-stability.mjs
          node scripts/verify-seasonal-v2-explicit-add-artwork.mjs
          node --test tests/seasonal-rotation.test.mjs
          node --test tests/seasonal-resize-printarea.test.mjs
          node --test tests/seasonal-print-master.test.mjs
          node scripts/verify-admin-payment-health.mjs
          node scripts/verify-payment-confirmation-authority.mjs
          node scripts/verify-checkout-preview-cors.mjs
          node scripts/verify-admin-print-configuration.mjs
          node scripts/verify-admin-production-files.mjs
          node scripts/verify-production-bypass-v2.mjs
          node scripts/verify-admin-legacy-retired.mjs
          node scripts/verify-admin-neumorphism-accessibility.mjs
          node scripts/verify-admin-authenticated-smoke.mjs
          node --test tests/admin-dashboard-settings-read.test.mjs
          node --test tests/admin-data-cleanup.test.mjs
          node --test tests/google-oauth-policy-receipt.test.mjs
          node --test tests/admin-smoke-origin.test.mjs
          node --test tests/admin-smoke-mobile-layout.test.mjs
          node --test tests/admin-sign-out-controls.test.mjs
          node scripts/verify-admin-mfa-onboarding.mjs
          node scripts/verify-safe-auto-merge.mjs
          node scripts/verify-custom-studio-print-guides.mjs
          node scripts/verify-custom-studio-print-pipeline.mjs
          node scripts/verify-dtf-preview-controls.mjs
          node --test tests/dtf-keyboard-delete.test.mjs
          node --test tests/dtf-undo-delete.test.mjs
          node scripts/verify-custom-studio-two-sided-cart-contract.mjs
          node scripts/verify-production-hardening.mjs
          node scripts/verify-messenger-agent.mjs
          node scripts/verify-cart-pricing.mjs
          node scripts/verify-checkout-shipping-zones.mjs
          node scripts/verify-checkout-shipping-profiles.mjs
          node scripts/verify-checkout-shipping-weight.mjs
          node scripts/verify-seasonal-artwork.mjs
          node --test tests/seasonal-source-policy.test.mjs
          node scripts/verify-photo-bootleg-desktop.mjs
          node --test tests/bootleg-expandable-collections.test.mjs
          node --test tests/bootleg-text-autofit.test.mjs
          node --test tests/studio-text-edge-crop.test.mjs
          node --test tests/studio-layer-tools-wide.test.mjs
          node --test tests/studio-print-area-bounds.test.mjs
          node --test tests/studio-visual-smoke-bounds.test.mjs
          node --test tests/studio-free-reshape.test.mjs
          node --test tests/studio-template-canvas-handles.test.mjs
          node --test tests/studio-final-review-text-parity.test.mjs
          node --test tests/studio-mobile-live-preview.test.mjs
          node --test tests/studio-desktop-view-zoom.test.mjs
          node --test tests/bootleg-print-overlays.test.mjs
          node --test tests/bootleg-direct-photo-pointer.test.mjs
          node --test tests/bootleg-photo-borders.test.mjs
          node --test tests/bootleg-glow-border.test.mjs
          node --test tests/bootleg-glow-visual.test.mjs
          node --test tests/bootleg-glow-preview-resets.test.mjs
          node scripts/verify-storefront-seo-ux.mjs

      - name: Verify immutable invoice ledger and atomic migration manifest
        run: |
          node --test scripts/verify-invoice-ledger.mjs
          node --test scripts/verify-invoice-atomic-bundle.mjs

      - name: Verify privileged RPC hardening preserves call contracts
        run: node --test scripts/verify-rpc-security-facades.mjs

      - name: Verify invoice checkout isolation and non-payment regressions
        run: |
          node --test scripts/verify-invoice-checkout-isolation.mjs
          node scripts/verify-checkout-terms-hotfix.mjs
          node scripts/verify-michaels-style-payment.mjs
          node scripts/verify-payment-fast-start.mjs
          node scripts/check-tax-breakdown.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run package regression checks
        run: |
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial

      - name: Build production app
        run: npm run build

      - name: Install Playwright render guard
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Compare premium text preview with 300-DPI render
        run: node scripts/verify-premium-text-browser.mjs

      - name: Verify admin MFA Verifying state never repeats submission
        run: node --test tests/admin-smoke-mfa.browser.test.mjs

      - name: Verify built storefront paints before merge
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/gdp-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node scripts/storefront-render-guard.mjs || {
            cat /tmp/gdp-preview.log
            exit 1
          }

      - name: Upload storefront render guard evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: storefront-render-guard-${{ github.run_id }}
          path: render-guard-results
          if-no-files-found: ignore
          retention-days: 7
