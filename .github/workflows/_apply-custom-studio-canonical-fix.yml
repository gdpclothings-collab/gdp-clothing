name: Apply Custom Studio Canonical Fix

on:
  push:
    branches:
      - fix/custom-studio-canonical-flow-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v5
        with:
          ref: fix/custom-studio-canonical-flow-20260913
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/_apply_custom_studio_canonical_fix.mjs

      - name: Keep CI workflow edits out of the automation commit
        run: git checkout -- .github/workflows/build-verification.yml

      - name: Syntax-check new regression guards
        run: |
          node --check scripts/verify-cart-pricing.mjs
          node --check scripts/verify-custom-studio-canonical-flow.mjs

      - name: Commit patched source
        run: |
          git config user.name "GDP Clothing Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src scripts/verify-cart-pricing.mjs scripts/verify-custom-studio-canonical-flow.mjs
          git commit -m "fix(custom-studio): unify approval flow and desktop UX [canonical-fix-applied]"
          git push origin HEAD:fix/custom-studio-canonical-flow-20260913
