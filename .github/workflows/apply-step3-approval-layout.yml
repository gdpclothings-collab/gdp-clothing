name: Apply Step 3 approval layout
on:
  push:
    paths:
      - ".github/workflows/apply-step3-approval-layout.yml"
permissions:
  contents: write
jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_step3_approval_layout.py
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-custom-studio-v2.mjs
      - run: npm run build
      - run: git diff --check
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx
          git commit -m "Refine Step 3 approval layout and remove Needed By"
          git push
