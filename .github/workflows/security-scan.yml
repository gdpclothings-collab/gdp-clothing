name: GDP Clothing Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  browser-secret-guard:
    name: Browser secret guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Block obvious privileged credentials in browser source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=node_modules --exclude='*.map' \
            '(sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_[A-Za-z0-9_-]{16,})' \
            src public index.html vite.config.js; then
            echo "Potential privileged credential detected in browser-delivered source."
            exit 1
          fi
          echo "No obvious privileged credential pattern found in browser-delivered source."
