name: GDP Fast Mode Blocker Report

on:
  workflow_run:
    workflows: ["Build Verification", "Quality Audit", "Production Smoke"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  blocker-report:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Surface exact failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## GDP FAST MODE blocker" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: ${{ github.event.workflow_run.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion=="failure") | "- Failed job: \(.name) (job id \(.id))"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery: inspect the failed job/log/artifacts, repair the smallest affected surface, rerun that failed job first, then complete the remaining required gates." >> "$GITHUB_STEP_SUMMARY"
