name: Patch Custom Studio V2 typecheck

on:
  push:
    branches:
      - rebuild/custom-studio-v2-production

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/custom-studio-v2-production
      - name: Apply exact source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/CustomStudioV2.jsx')
          text = path.read_text()
          replacements = [
              ("const [settings, setSettings] = useState({});", "const [settings, setSettings] = useState({ styleTemplates: {}, frontBackFee: 10 });"),
              ("buildSeasonalStudioV2Snapshot({ productId: product.id, size: state.size, color: state.color, side, layers: editor.layers })", "buildSeasonalStudioV2Snapshot({ productId: product.id, size: state.size, color: state.color, layers: editor.layers })"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/patch-v2-typecheck.yml
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx .github/workflows/patch-v2-typecheck.yml
          git commit -m "Fix Custom Studio V2 static types"
          git push origin HEAD:rebuild/custom-studio-v2-production
