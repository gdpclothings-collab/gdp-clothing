name: Apply Memorial Typography Integration

on:
  push:
    branches:
      - codex/memorial-typography-editor
    paths:
      - .github/workflows/apply-memorial-typography.yml
      - scripts/apply-memorial-typography-integration.mjs

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source integration
        run: node scripts/apply-memorial-typography-integration.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run Memorial regression test
        run: npm run test:memorial

      - name: Build production bundle
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit integrated source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated integration changes to commit."
            exit 0
          fi
          git config user.name "gdp-clothing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/MemorialTypographyEditor.jsx scripts/verify-memorial-tribute.mjs
          git commit -m "feat: integrate Memorial typography controls [memorial-typography-applied]"
          git push origin HEAD:codex/memorial-typography-editor
