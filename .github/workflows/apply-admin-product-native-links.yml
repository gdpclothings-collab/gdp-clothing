name: Apply Admin Product Native Links

on:
  push:
    branches:
      - fix/admin-product-native-links
    paths:
      - scripts/apply-admin-product-native-links.mjs
      - .github/workflows/apply-admin-product-native-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-product-native-links
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted native-link patch
        run: node scripts/apply-admin-product-native-links.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Verify product-link invariants
        shell: bash
        run: |
          grep -q 'href={`/products/${product.slug}`}' src/components/admin/ProductsModule.jsx
          grep -q 'right-click for new tab or window' src/components/admin/ProductsModule.jsx
          grep -q 'setEditor({ mode: "edit", product })' src/components/admin/ProductsModule.jsx
          git diff --check
      - name: Commit generated code changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "gdp-clothing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/admin/ProductsModule.jsx
          git commit -m "feat: make admin product rows native links"
          git push origin HEAD:fix/admin-product-native-links
