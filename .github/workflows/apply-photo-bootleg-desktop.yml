name: Apply Photo Bootleg Desktop Refinement

on:
  push:
    branches:
      - fix/photo-bootleg-desktop-20260911

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v5
        with:
          ref: fix/photo-bootleg-desktop-20260911
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply scoped Photo Bootleg refinements
        run: python3 scripts/apply-photo-bootleg-desktop.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Photo Bootleg regression guard
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Run existing Custom Studio desktop guard
        run: node scripts/verify-custom-studio-desktop.mjs

      - name: Build production app
        run: npm run build

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-photo-bootleg-desktop.yml scripts/apply-photo-bootleg-desktop.py
          git add src/pages/CustomStudio.jsx src/components/storefront/customStudioDesktop.css scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "fix: refine Photo Bootleg desktop editor"
          git push origin HEAD:fix/photo-bootleg-desktop-20260911
