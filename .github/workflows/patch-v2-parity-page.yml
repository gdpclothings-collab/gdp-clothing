name: Patch V2 interaction parity page

on:
  push:
    branches:
      - rebuild/custom-studio-v2-interaction-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/custom-studio-v2-interaction-parity
      - name: Apply exact V2 page integrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/CustomStudioV2.jsx')
          text = path.read_text()

          replacements = [
            ("import { useNavigate } from 'react-router-dom';", "import { useLocation, useNavigate } from 'react-router-dom';"),
            ("  renderProtectedStudioV2Png,\n", ""),
            ("} from '@/lib/customStudioV2Production';\n", "} from '@/lib/customStudioV2Production';\nimport { renderProtectedStudioV2PngAdvanced } from '@/lib/customStudioV2ProtectedProduction';\n"),
            ("export default function CustomStudioV2() {\n  const navigate = useNavigate();\n  const { addItem } = useCart();\n  const [state, setState] = useState(() => createInitialStudioV2State());", "export default function CustomStudioV2() {\n  const navigate = useNavigate();\n  const location = useLocation();\n  const { addItem, replaceItem } = useCart();\n  const editCartKey = String(location.state?.editCartKey || '');\n  const [state, setState] = useState(() => {\n    const draftState = location.state?.studioV2Draft?.state;\n    if (!draftState || location.state?.studioV2Draft?.version !== 1) return createInitialStudioV2State();\n    return {\n      ...draftState,\n      step: 'customize',\n      approval: { ...(draftState.approval || {}), finalDesignApproved: false },\n    };\n  });"),
            ("          snapshot = { version: 2, designPath: state.designPath, side, templateId: template.id, photoPath: editor.photo?.path || '', transform: editor.transform, text: editor.text, printArea: resolveStudioV2PrintProfile(product, state.size, side) };\n          rendered = await renderProtectedStudioV2Png({ product, size: state.size, side, editor, template, dpi: 300 });\n          if (editor.photo?.path && !sourceAssets.some((asset) => asset.path === editor.photo.path)) sourceAssets.push({ path: editor.photo.path, name: editor.photo.name || `${side}-photo`, width: editor.photo.width || null, height: editor.photo.height || null, isPrimary: sourceAssets.length === 0 });", "          const protectedPhotos = (editor.photos?.length ? editor.photos : (editor.photo?.path ? [{ id: 'primary-photo', asset: editor.photo, transform: editor.transform || {}, order: 0 }] : []));\n          snapshot = {\n            version: 3,\n            designPath: state.designPath,\n            side,\n            templateId: template.id,\n            photos: protectedPhotos.map((layer) => ({ id: layer.id, path: layer.asset?.path || '', transform: layer.transform || {}, order: Number(layer.order || 0), backgroundMode: layer.asset?.backgroundMode || 'original' })),\n            stickers: (editor.stickers || []).map((layer) => ({ id: layer.id, stickerId: layer.stickerId, glyph: layer.glyph || '', assetUrl: layer.assetUrl || '', transform: layer.transform || {}, order: Number(layer.order || 0) })),\n            text: editor.text || {},\n            textStyle: editor.textStyle || {},\n            printArea: resolveStudioV2PrintProfile(product, state.size, side),\n          };\n          rendered = await renderProtectedStudioV2PngAdvanced({ product, size: state.size, side, editor, template, profile: resolveStudioV2PrintProfile, dpi: 300 });\n          protectedPhotos.forEach((layer) => {\n            const asset = layer.asset || {};\n            if (asset.path && !sourceAssets.some((item) => item.path === asset.path)) sourceAssets.push({ path: asset.path, name: asset.name || `${side}-photo`, width: asset.width || null, height: asset.height || null, isPrimary: sourceAssets.length === 0 });\n          });"),
            ("        needByDate: state.approval.needByDate || null,\n      };\n      addItem(cartItem);", "        needByDate: state.approval.needByDate || null,\n        studioV2Draft: {\n          version: 1,\n          state: {\n            ...state,\n            step: 'customize',\n            approval: { ...state.approval, finalDesignApproved: false },\n          },\n        },\n      };\n      if (editCartKey) replaceItem(editCartKey, cartItem);\n      else addItem(cartItem);"),
            ("<ProtectedTemplateEditorV2 path={state.designPath} product={product} settings={settings} editor={currentEditor}", "<ProtectedTemplateEditorV2 path={state.designPath} product={product} settings={settings} editor={currentEditor} side={state.side}"),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:140]!r}')
            text = text.replace(old, new)

          path.write_text(text)
          PY
          rm .github/workflows/patch-v2-parity-page.yml
      - name: Commit integrations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx .github/workflows/patch-v2-parity-page.yml
          git commit -m "Wire V2 layered editor into production and cart edits"
          git push origin HEAD:rebuild/custom-studio-v2-interaction-parity
