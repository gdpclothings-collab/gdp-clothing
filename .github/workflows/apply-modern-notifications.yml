name: Apply modern notification migration

on:
  push:
    paths:
      - ".github/workflows/apply-modern-notifications.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply notification migration
        run: node scripts/apply-modern-notifications.mjs

      - name: Commit migrated UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/pages/DTFGangSheet.jsx
          git commit -m "Replace legacy browser confirmation dialogs"
          git push
