name: Patch checkout shipping zones

on:
  push:
    branches:
      - fix/checkout-shipping-zones-20261001

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python scripts/apply-shipping-zone-patch.py

      - name: Commit targeted patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/checkout/index.ts supabase/functions/checkout/shipping-zone-rules.mjs src/lib/customerApi.js src/pages/CheckoutTwoStep.jsx scripts/verify-checkout-shipping-zones.mjs .github/workflows/build-verification.yml
          git diff --cached --check
          node scripts/verify-checkout-shipping-zones.mjs
          git commit -m "feat(checkout): honor province and postal shipping zones [skip ci]"
          git push origin HEAD:fix/checkout-shipping-zones-20261001
