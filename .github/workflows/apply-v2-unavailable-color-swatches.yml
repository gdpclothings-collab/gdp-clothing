name: Apply V2 unavailable color swatches

# Retry 2 after regression assertion quote fix.
on:
  push:
    branches:
      - fix/v2-unavailable-color-swatches
    paths:
      - ".github/workflows/apply-v2-unavailable-color-swatches.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2-unavailable-color-swatches

      - name: Validate patcher syntax
        run: python -m py_compile scripts/apply_v2_unavailable_color_swatches.py

      - name: Apply scoped V2 color availability repair
        run: python scripts/apply_v2_unavailable_color_swatches.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify product variants
        run: node scripts/verify-product-variants.mjs

      - name: Verify Custom Studio V2 contracts
        run: node scripts/verify-custom-studio-v2.mjs

      - name: Build production bundle
        run: npm run build

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit verified source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx src/lib/customStudioV2State.js scripts/verify-custom-studio-v2.mjs
          git commit -m "Fix unavailable colors in Custom Studio V2"
          git push origin HEAD:fix/v2-unavailable-color-swatches
