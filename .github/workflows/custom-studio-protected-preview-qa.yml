name: GDP Studio Protected Preview QA (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protected-preview:
    if: github.head_ref == 'fix/studio-review-all-design-paths-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_BASE_URL: https://fix-studio-review-all-design.gdp-clothing.pages.dev
      SMOKE_ARTIFACT_DIR: protected-preview-results
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install isolated browser runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify preview is reachable
        run: curl -fsSL --max-time 20 "$PRODUCTION_BASE_URL/custom-studio" -o /dev/null
      - name: Verify protected design Final Review
        run: node scripts/custom-studio-protected-final-review-smoke.mjs
      - name: Upload read-only QA screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: protected-preview-qa
          path: protected-preview-results
          if-no-files-found: ignore
          retention-days: 3
