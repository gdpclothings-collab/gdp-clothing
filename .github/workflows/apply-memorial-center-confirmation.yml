name: Apply Memorial center confirmation safely

on:
  push:
    branches:
      - fix/memorial-center-confirmation
    paths:
      - "scripts/apply_memorial_center_confirmation.py"
      - ".github/workflows/apply-memorial-center-confirmation.yml"

permissions:
  contents: write

jobs:
  apply-verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: fix/memorial-center-confirmation

      - name: Apply scoped V2 UI patch
        run: python scripts/apply_memorial_center_confirmation.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Photo Bootleg and Memorial contracts
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Verify Custom Studio V2 contracts
        run: node scripts/verify-custom-studio-v2.mjs

      - name: Verify print guides
        run: node scripts/verify-custom-studio-print-guides.mjs

      - name: Build production bundle
        run: npm run build

      - name: Check diff cleanliness
        run: git diff --check

      - name: Commit verified UI changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx \
            scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "Center Memorial completion action with live preview"
          git push
