name: Apply Photo Bootleg persistent confirm refinement

on:
  push:
    paths:
      - ".github/workflows/apply-photo-bootleg-persistent-confirm.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply guarded Photo Bootleg refinement
        run: node scripts/apply-photo-bootleg-persistent-confirm.mjs

      - name: Verify Photo Bootleg contracts
        run: node scripts/verify-photo-bootleg-desktop.mjs

      - name: Commit generated UI refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated UI changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx scripts/verify-photo-bootleg-desktop.mjs
          git commit -m "Refine Photo Bootleg persistent completion and text controls"
          git push
