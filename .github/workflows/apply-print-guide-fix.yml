name: Apply garment print guide repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/garment-print-size-guides'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply targeted print-guide changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          helper = r'''import { resolveStudioV2PrintProfile } from '@/lib/customStudioV2Production';

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, Number(value || 0)));
}

function garmentKind(product) {
  const token = [product?.name, product?.type, product?.category, product?.slug]
    .filter(Boolean)
    .join(' ')
    .toLowerCase();

  if (/(baby|bodysuit|onesie|infant)/.test(token)) return 'baby';
  if (token.includes('toddler')) return 'toddler';
  if (/(youth|kids|kid)/.test(token)) return 'youth';
  if (/(hoodie|hooded)/.test(token)) return 'hoodie';
  if (/(crewneck|crew neck|sweatshirt|sweater)/.test(token) && !/(t-shirt|t shirt|tee|long sleeve)/.test(token)) return 'crewneck';
  return 'adult';
}

const DISPLAY_GEOMETRY = {
  baby: { maxWidthIn: 6, maxVisualWidth: 34, frontTop: 29, backTop: 26 },
  toddler: { maxWidthIn: 7.5, maxVisualWidth: 38, frontTop: 25, backTop: 23 },
  youth: { maxWidthIn: 10, maxVisualWidth: 41, frontTop: 24, backTop: 22 },
  hoodie: { maxWidthIn: 12, maxVisualWidth: 42, frontTop: 25, backTop: 21 },
  crewneck: { maxWidthIn: 12, maxVisualWidth: 43, frontTop: 23, backTop: 21 },
  adult: { maxWidthIn: 12, maxVisualWidth: 44, frontTop: 22, backTop: 20 },
};

function formatInches(value) {
  const number = Number(value || 0);
  return Number.isInteger(number) ? String(number) : String(Math.round(number * 10) / 10);
}

/**
 * Presentation geometry for the dashed Custom Studio print guide.
 *
 * Physical dimensions always come from the same production profile used by
 * final 300-DPI rendering. The percentages below only map that real print area
 * onto each garment mockup; they never alter artwork coordinates or output.
 */
export function resolveStudioV2PrintGuide(product, size, side = 'front') {
  const normalizedSide = side === 'back' ? 'back' : 'front';
  const profile = resolveStudioV2PrintProfile(product, size, normalizedSide);
  const geometry = DISPLAY_GEOMETRY[garmentKind(product)] || DISPLAY_GEOMETRY.adult;
  const ratio = clamp(Number(profile.widthIn) / geometry.maxWidthIn, 0.55, 1);
  const widthPercent = Math.round(geometry.maxVisualWidth * ratio * 10) / 10;
  const topPercent = normalizedSide === 'back' ? geometry.backTop : geometry.frontTop;

  return {
    ...profile,
    label: `${formatInches(profile.widthIn)} × ${formatInches(profile.heightIn)} in`,
    style: {
      top: `${topPercent}%`,
      width: `${widthPercent}%`,
      aspectRatio: `${Number(profile.widthIn)} / ${Number(profile.heightIn)}`,
    },
  };
}
'''
          Path('src/lib/customStudioV2PrintGuide.js').write_text(helper)

          replace_once(
              'src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx',
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\n",
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\nimport { resolveStudioV2PrintGuide } from '@/lib/customStudioV2PrintGuide';\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx',
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n",
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n  const printGuide = useMemo(() => resolveStudioV2PrintGuide(product, size, side), [product, size, side]);\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx',
              '            <div className="absolute left-1/2 top-[24%] aspect-[4/5] w-[42%] -translate-x-1/2 overflow-hidden rounded-lg border-2 border-dashed border-white/80 bg-black/5 shadow-[0_0_0_1px_rgba(15,23,42,.15)]">\n',
              '            <div data-gdp-print-guide="true" aria-label={`Recommended ${side} print area ${printGuide.label}`} className="absolute left-1/2 -translate-x-1/2 overflow-hidden rounded-lg border-2 border-dashed border-white/80 bg-black/5 shadow-[0_0_0_1px_rgba(15,23,42,.15)]" style={printGuide.style}>\n              <span className="pointer-events-none absolute right-1 top-1 z-50 rounded-md bg-slate-950/75 px-1.5 py-0.5 text-[8px] font-black tracking-wide text-white">{printGuide.label}</span>\n',
          )

          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\n",
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\nimport { resolveStudioV2PrintGuide } from '@/lib/customStudioV2PrintGuide';\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              "function ProtectedPreview({ product, color, template, editor, path, stickers, side, onPatch }) {\n",
              "function ProtectedPreview({ product, color, size, template, editor, path, stickers, side, onPatch }) {\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n",
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n  const printGuide = useMemo(() => resolveStudioV2PrintGuide(product, size, side), [product, size, side]);\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              '        <div ref={canvasRef} className="absolute left-1/2 top-[23%] aspect-[4/5] w-[43%] -translate-x-1/2 overflow-hidden rounded-lg border border-dashed border-slate-400/70 bg-white/10">\n',
              '        <div ref={canvasRef} data-gdp-print-guide="true" aria-label={`Recommended ${side} print area ${printGuide.label}`} className="absolute left-1/2 -translate-x-1/2 overflow-hidden rounded-lg border border-dashed border-slate-400/70 bg-white/10" style={printGuide.style}>\n          <span className="pointer-events-none absolute right-1 top-1 z-50 rounded-md bg-slate-950/75 px-1.5 py-0.5 text-[8px] font-black tracking-wide text-white">{printGuide.label}</span>\n',
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              "export default function ProtectedTemplateEditorV2({ path, product, color, settings, editor, side = 'front', onPatch, onConfirmedChange }) {\n",
              "export default function ProtectedTemplateEditorV2({ path, product, color, size, settings, editor, side = 'front', onPatch, onConfirmedChange }) {\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx',
              '<ProtectedPreview product={product} color={color} template={template} editor={editor} path={path} stickers={stickerLibrary} side={side} onPatch={onPatch} />',
              '<ProtectedPreview product={product} color={color} size={size} template={template} editor={editor} path={path} stickers={stickerLibrary} side={side} onPatch={onPatch} />',
          )

          replace_once(
              'src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx',
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\n",
              "import { studioV2GarmentPreview } from '@/lib/customStudioV2Preview';\nimport { resolveStudioV2PrintGuide } from '@/lib/customStudioV2PrintGuide';\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx',
              'export default function UploadArtworkEditorV2({ product, color, side, editor, onPatch, onConfirmedChange }) {\n',
              'export default function UploadArtworkEditorV2({ product, color, size, side, editor, onPatch, onConfirmedChange }) {\n',
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx',
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n",
              "  const garmentPreview = studioV2GarmentPreview(product, color, side);\n  const printGuide = resolveStudioV2PrintGuide(product, size, side);\n",
          )
          replace_once(
              'src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx',
              '            <div className="absolute left-1/2 top-[23%] aspect-[4/5] w-[43%] -translate-x-1/2 overflow-hidden rounded-lg border-2 border-dashed border-slate-500/50 bg-white/5">\n',
              '            <div data-gdp-print-guide="true" aria-label={`Recommended ${side} print area ${printGuide.label}`} className="absolute left-1/2 -translate-x-1/2 overflow-hidden rounded-lg border-2 border-dashed border-slate-500/50 bg-white/5" style={printGuide.style}>\n              <span className="pointer-events-none absolute right-1 top-1 z-50 rounded-md bg-slate-950/75 px-1.5 py-0.5 text-[8px] font-black tracking-wide text-white">{printGuide.label}</span>\n',
          )

          replace_once(
              'src/pages/CustomStudioV2.jsx',
              '<ProtectedTemplateEditorV2 path={state.designPath} product={product} color={state.color} settings={settings}',
              '<ProtectedTemplateEditorV2 path={state.designPath} product={product} color={state.color} size={state.size} settings={settings}',
          )
          replace_once(
              'src/pages/CustomStudioV2.jsx',
              '<UploadArtworkEditorV2 product={product} color={state.color} side={state.side}',
              '<UploadArtworkEditorV2 product={product} color={state.color} size={state.size} side={state.side}',
          )

          verification = r'''import fs from 'node:fs';

const read = (path) => fs.readFileSync(path, 'utf8');
const fail = (message) => { throw new Error(message); };

const helper = read('src/lib/customStudioV2PrintGuide.js');
const seasonal = read('src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx');
const protectedEditor = read('src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx');
const upload = read('src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx');
const studio = read('src/pages/CustomStudioV2.jsx');

for (const kind of ['baby', 'toddler', 'youth', 'hoodie', 'crewneck', 'adult']) {
  if (!helper.includes(`${kind}:`)) fail(`Missing ${kind} display calibration.`);
}
if (!helper.includes('resolveStudioV2PrintProfile')) fail('Print guide is not tied to the production profile.');
for (const [name, source] of [['seasonal', seasonal], ['protected', protectedEditor], ['upload', upload]]) {
  if (!source.includes('data-gdp-print-guide="true"')) fail(`${name} editor is missing the calibrated print guide.`);
  if (source.includes('top-[23%] aspect-[4/5] w-[43%]') || source.includes('top-[24%] aspect-[4/5] w-[42%]')) fail(`${name} editor still contains the legacy fixed guide.`);
  if (!source.includes('printGuide.label')) fail(`${name} editor does not show print dimensions.`);
}
if (!studio.includes('size={state.size} settings={settings}')) fail('Protected editor is not receiving selected size.');
if (!studio.includes('size={state.size} side={state.side} editor={currentEditor}')) fail('Upload editor is not receiving selected size.');
console.log('Custom Studio print guide verification passed.');
'''
          Path('scripts/verify-custom-studio-print-guides.mjs').write_text(verification)
          PY

      - name: Verify targeted guide wiring
        run: node scripts/verify-custom-studio-print-guides.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript
        run: npx eslint src/lib/customStudioV2PrintGuide.js src/pages/CustomStudioV2.jsx src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx scripts/verify-custom-studio-print-guides.mjs --quiet

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-print-guide-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudioV2.jsx src/lib/customStudioV2PrintGuide.js src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx scripts/verify-custom-studio-print-guides.mjs .github/workflows/apply-print-guide-fix.yml
          git commit -m "fix: calibrate garment print size guides"
          git push origin HEAD:${{ github.head_ref }}
