name: GDP Clothing Safe Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: safe-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-after-verification:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for required checks
        shell: bash
        run: |
          set -euo pipefail

          required_checks=(
            "Cloudflare Pages"
            "standalone-build"
            "static-quality"
            "Browser secret guard"
            "CodeQL"
          )

          for attempt in {1..60}; do
            current_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "${current_sha}" != "${EXPECTED_SHA}" ]]; then
              echo "Pull request head changed; the synchronize event will start a fresh verification."
              exit 0
            fi

            check_runs="$(gh api --paginate "repos/${REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100")"
            all_passed=true

            for check_name in "${required_checks[@]}"; do
              matching_count="$(jq --arg name "${check_name}" '[.check_runs[] | select(.name == $name)] | length' <<<"${check_runs}")"
              passing_count="$(jq --arg name "${check_name}" '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<<"${check_runs}")"
              failing_count="$(jq --arg name "${check_name}" '[.check_runs[] | select(.name == $name and .status == "completed" and (.conclusion != "success" and .conclusion != "skipped"))] | length' <<<"${check_runs}")"

              if (( failing_count > 0 )); then
                echo "Required check failed: ${check_name}"
                exit 1
              fi

              if (( matching_count == 0 || passing_count == 0 )); then
                all_passed=false
              fi
            done

            if [[ "${all_passed}" == "true" ]]; then
              echo "All required checks passed."
              break
            fi

            if (( attempt == 60 )); then
              echo "Timed out waiting for required checks."
              exit 1
            fi

            sleep 20
          done

      - name: Confirm mergeable state
        shell: bash
        run: |
          set -euo pipefail

          # This workflow itself is a check run on the pull request. While this
          # job is running GitHub can report mergeable_state=unstable even after
          # every required external check above has passed. Use the actual
          # mergeable boolean for conflict safety and only allow states that are
          # mergeable without bypassing branch/review constraints.
          for attempt in {1..12}; do
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            current_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            mergeable="$(jq -r '.mergeable' <<<"${pr_json}")"
            mergeable_state="$(jq -r '.mergeable_state' <<<"${pr_json}")"

            if [[ "${current_sha}" != "${EXPECTED_SHA}" ]]; then
              echo "Pull request head changed; the synchronize event will start a fresh verification."
              exit 0
            fi

            if [[ "${mergeable}" == "true" && ( "${mergeable_state}" == "clean" || "${mergeable_state}" == "unstable" ) ]]; then
              echo "Pull request is mergeable with verified state: ${mergeable_state}."
              exit 0
            fi

            if [[ "${mergeable}" == "false" || "${mergeable_state}" == "dirty" || "${mergeable_state}" == "blocked" || "${mergeable_state}" == "behind" ]]; then
              echo "Pull request is not safely mergeable: mergeable=${mergeable}, state=${mergeable_state}"
              exit 1
            fi

            if (( attempt == 12 )); then
              echo "Timed out waiting for GitHub to resolve mergeability: mergeable=${mergeable}, state=${mergeable_state}"
              exit 1
            fi

            sleep 5
          done

      - name: Squash merge verified pull request
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --squash --match-head-commit "${EXPECTED_SHA}"

      - name: Dispatch production smoke for merged commit
        shell: bash
        run: |
          set -euo pipefail

          merged_sha=""
          for attempt in {1..12}; do
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            merged="$(jq -r '.merged' <<<"${pr_json}")"
            candidate="$(jq -r '.merge_commit_sha // empty' <<<"${pr_json}")"
            if [[ "${merged}" == "true" && -n "${candidate}" && "${candidate}" != "null" ]]; then
              merged_sha="${candidate}"
              break
            fi
            sleep 2
          done

          if [[ -z "${merged_sha}" ]]; then
            echo "Could not resolve the merged commit SHA for post-merge smoke."
            exit 1
          fi

          current_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_main_sha}" != "${merged_sha}" ]]; then
            echo "main advanced to ${current_main_sha}; its newer merge will own production smoke."
            exit 0
          fi

          echo "Dispatching Production Smoke for merged SHA ${merged_sha}."
          gh workflow run production-smoke.yml \
            --repo "${REPOSITORY}" \
            --ref main \
            -f expected_sha="${merged_sha}" \
            -f base_url="https://gdpclothing.ca"
