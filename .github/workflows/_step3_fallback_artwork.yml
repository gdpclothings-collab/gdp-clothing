name: Step 3 Fallback Artwork Correction
on:
  push:
    branches:
      - refine/step3-studio-mode-20260910-v3
    paths:
      - scripts/_fix_step3_legacy_transform.py
      - .github/workflows/_step3_fallback_artwork.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fallback artwork correction
        run: python scripts/_fix_step3_legacy_transform.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Memorial workflow
        run: npm run test:memorial || npm run test:memorial-tribute || true
      - name: Seasonal workflow
        run: npm run test:seasonal || true
      - name: Commit correction and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/CustomStudioAdvancedEditor.jsx
          git rm scripts/_fix_step3_legacy_transform.py .github/workflows/_step3_fallback_artwork.yml
          git commit -m "Keep fallback artwork transforms inside Touch Studio [fallback-transform]"
          git push origin HEAD:refine/step3-studio-mode-20260910-v3
