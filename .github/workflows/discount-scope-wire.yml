name: Discount Scope Wiring

on:
  push:
    branches:
      - fix/discount-scope-wiring
    paths:
      - .github/workflows/discount-scope-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/discount-scope-wiring
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair patch expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_discount_scope_wire.py')
          text = path.read_text()
          old = '''    2,\n    "checkout pricing response coupon detail",\n)'''
          new = '''    1,\n    "checkout pricing response coupon detail",\n)'''
          if old not in text:
              raise SystemExit('Could not locate pricing response patch expectation')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply targeted discount wiring patch
        run: python3 scripts/_apply_discount_scope_wire.py

      - name: Add coupon details to successful checkout response
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/checkout/index.ts')
          text = path.read_text()
          old = '''      uiMode: "custom",\n      pricing: {\n        subtotal,\n        discount: roundMoney(quantityDiscount + couponAmount),\n        shipping,'''
          new = '''      uiMode: "custom",\n      pricing: {\n        subtotal,\n        discount: roundMoney(quantityDiscount + couponAmount),\n        couponAmount,\n        couponCode: coupon?.code || null,\n        shipping,'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected successful pricing response once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify discount rule helpers
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { couponAmountForBase, couponIsUsable, publicPromotion } from './supabase/functions/checkout/discount-rules.mjs';

          const active = { active:true, type:'percentage', value:50, usage_count:0, usage_limit:null, min_purchase:0 };
          assert.equal(couponIsUsable(active, 39.99), true);
          assert.equal(couponAmountForBase(active, 39.99), 20);
          assert.equal(couponAmountForBase({ ...active, type:'fixed', value:100 }, 39.99), 39.99);
          assert.equal(couponIsUsable({ ...active, min_purchase:50 }, 39.99), false);
          assert.equal(couponIsUsable({ ...active, active:false }, 100), false);
          const safe = publicPromotion({ ...active, code:'50OFF', applies_to:'product', applies_to_id:'secret-id' });
          assert.equal(safe.code, '50OFF');
          assert.equal(Object.prototype.hasOwnProperty.call(safe, 'applies_to_id'), false);
          console.log('discount helper checks passed');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build verification
        run: npm run build

      - name: Quality lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Static regression assertions
        run: |
          grep -q 'getProductPromotions' supabase/functions/checkout/index.ts
          grep -q 'couponBaseForNormalizedItems' supabase/functions/checkout/index.ts
          grep -q 'discountedByProduct' src/lib/cartPricing.js
          grep -q 'This discount code does not apply to the items in your cart' src/pages/CheckoutTwoStep.jsx
          grep -q 'with code' src/pages/ProductDetail.jsx
          grep -q 'discountTargetName' src/components/admin/DiscountsModule.jsx
          test "$(grep -c 'couponCode: coupon?.code || null' supabase/functions/checkout/index.ts)" -eq 2

      - name: Remove temporary patch machinery
        run: |
          rm scripts/_apply_discount_scope_wire.py
          rm .github/workflows/discount-scope-wire.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire product-scoped discounts end to end"
          git push origin HEAD:fix/discount-scope-wiring
