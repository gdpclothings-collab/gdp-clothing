name: Run recommended print guide repair

on:
  push:
    branches:
      - fix/recommended-print-guides-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/recommended-print-guides-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted repair
        run: python scripts/apply-recommended-print-guide-v2.py

      - name: Install dependencies
        run: npm ci

      - name: Verify print guide wiring
        run: node scripts/verify-custom-studio-print-guides.mjs

      - name: Lint changed JavaScript
        run: npx eslint src/lib/customStudioV2Production.js src/lib/customStudioV2PrintGuide.js src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx scripts/verify-custom-studio-print-guides.mjs --quiet

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git rm .github/workflows/run-recommended-print-guide-v2.yml
          git rm .github/workflows/run-recommended-print-guide-v2b.yml
          git rm scripts/apply-recommended-print-guide-v2.py
          git add src/lib/customStudioV2Production.js src/lib/customStudioV2PrintGuide.js src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx scripts/verify-custom-studio-print-guides.mjs supabase/migrations/20260917021000_recommended_apparel_print_guides_v2.sql
          git commit -m "Fix recommended garment print areas"
          git push origin HEAD:fix/recommended-print-guides-v2
