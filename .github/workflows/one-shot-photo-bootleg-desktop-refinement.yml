name: One-shot Photo Bootleg Desktop Refinement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine-photo-bootleg:
    if: contains(github.event.head_commit.message, 'Install one-shot Photo Bootleg desktop refinement')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply focused Photo Bootleg refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          editor_path = Path('src/components/storefront/CustomStudioAdvancedEditor.jsx')
          studio_path = Path('src/pages/CustomStudio.jsx')
          editor = editor_path.read_text()
          studio = studio_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Desktop keyboard delete removes only the selected canvas layer.
          # The underlying uploaded photo remains in photoAssets / Media and can be re-added.
          anchor = '  const [canvasDockHost, setCanvasDockHost] = useState(null);\n\n  useEffect(() => {\n    const resolveCanvasDockHost = () => {'
          insertion = '''  const [canvasDockHost, setCanvasDockHost] = useState(null);\n\n  useEffect(() => {\n    const handleKeyboardDelete = (event) => {\n      if (event.repeat || (event.key !== "Delete" && event.key !== "Backspace")) return;\n      const target = event.target;\n      const tagName = String(target?.tagName || "").toLowerCase();\n      const isTyping = Boolean(target?.isContentEditable) || tagName === "input" || tagName === "textarea" || tagName === "select";\n      if (isTyping || !selectedLayer || selectedLayer.locked) return;\n      event.preventDefault();\n      onDeleteLayer?.(selectedLayer.id);\n      onSelectLayer?.("photo");\n      setShowStickers(false);\n      setShowPhotoPicker(false);\n      setActiveTool("layers");\n      setPanelTab(selectedLayer.type === "text" ? "lettering" : selectedLayer.type === "sticker" ? "layers" : "photos");\n    };\n    window.addEventListener("keydown", handleKeyboardDelete);\n    return () => window.removeEventListener("keydown", handleKeyboardDelete);\n  }, [selectedLayer?.id, selectedLayer?.locked, selectedLayer?.type, onDeleteLayer, onSelectLayer]);\n\n  useEffect(() => {\n    const resolveCanvasDockHost = () => {'''
          editor = replace_once(editor, anchor, insertion, 'keyboard delete hook')

          # 2) Keep uploaded media persistent in Photo Bootleg. Do not expose permanent asset deletion.
          old_delete = '          <button type="button" onClick={onDeletePhoto} className="rounded-xl border border-[#D9273E]/30 bg-[#D9273E]/10 px-3 py-3 text-[10px] font-bold uppercase text-[#FF8898]"><Trash2 size={14} className="mx-auto mb-1"/>Delete photo</button>'
          new_delete = '          {designPath !== "bootleg" && <button type="button" onClick={onDeletePhoto} className="rounded-xl border border-[#D9273E]/30 bg-[#D9273E]/10 px-3 py-3 text-[10px] font-bold uppercase text-[#FF8898]"><Trash2 size={14} className="mx-auto mb-1"/>Delete photo</button>}'
          editor = replace_once(editor, old_delete, new_delete, 'persistent Media deletion guard')

          # 3) Simplify Photo Bootleg context tools while preserving the important editing capabilities.
          start = editor.index('  const contextTools = /** @type')
          end = editor.index('  const panelTabs = /** @type', start)
          replacement = '''  const photoContextTools = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [\n    ["transform", Move, "Move / Size"],\n    ["crop", Crop, "Crop"],\n    ["background", WandSparkles, "Remove BG"],\n    ["erase", Eraser, "Erase"],\n    ["more", Layers, "More"],\n  ] : [\n    ["replace", ImageIcon, "Replace"],\n    ["background", WandSparkles, "Remove BG"],\n    ["crop", Crop, "Crop"],\n    ["adjust", SlidersHorizontal, "Adjust"],\n    ["erase", Eraser, "Erase"],\n    ["transform", Move, "Transform"],\n    ["more", Layers, "More"],\n  ]);\n\n  const textContextTools = /** @type {Array<[string, React.ComponentType<any>, string]>} */ (designPath === "bootleg" ? [\n    ["edit", Type, "Edit"],\n    ["font", Type, "Font"],\n    ["style", Sparkles, "Style"],\n    ["color", Sparkles, "Color"],\n    ["curve", RotateCcw, "Curve"],\n    ["transform", Move, "Move / Size"],\n    ["more", Layers, "More"],\n  ] : [\n    ["edit", Type, "Edit"],\n    ["font", Type, "Font"],\n    ["style", Sparkles, "Style"],\n    ["color", Sparkles, "Color"],\n    ["curve", RotateCcw, "Curve"],\n    ["effects", WandSparkles, "Effects"],\n    ["spacing", Maximize2, "Spacing"],\n    ["transform", Move, "Transform"],\n    ["more", Layers, "More"],\n  ]);\n\n  const contextTools = selectedType === "photo"\n    ? photoContextTools\n    : selectedType === "text"\n      ? textContextTools\n      : selectedType === "sticker"\n        ? [["transform", Move, "Transform"], ["more", Layers, "More"]]\n        : [];\n\n'''
          editor = editor[:start] + replacement + editor[end:]

          # 4) Rename Photos to Media for the customer-facing editor.
          editor = replace_once(
              editor,
              '["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Photos"],',
              '["photos", ImageIcon, designPath === "upload" ? "Artwork" : "Media"],',
              'Media tab label'
          )
          editor = replace_once(editor, '<span>Available media</span>', '<span>Media library</span>', 'Media library label')

          # 5) Replace verbose guidance with a compact Photo Bootleg-specific rule.
          old_hint = '''      <div className="mt-2 rounded-xl border border-white/[.08] bg-white/[.035] px-3 py-2 text-[9px] leading-relaxed text-white/48">\n        <strong className="text-white/80">Touch-first:</strong> drag to move · pinch to resize · twist to rotate · double-tap text to type · double-tap a photo for crop mode.\n      </div>'''
          new_hint = '''      <div className="mt-2 rounded-xl border border-white/[.08] bg-white/[.035] px-3 py-2 text-[9px] leading-relaxed text-white/48">\n        {designPath === "bootleg" ? <><strong className="text-white/80">Simple editing:</strong> select a photo or text on the garment, then move, resize or edit it here. Press Delete / Backspace to remove the selected item from the canvas. Uploaded photos stay saved in Media.</> : <><strong className="text-white/80">Touch-first:</strong> drag to move · pinch to resize · twist to rotate · double-tap text to type · double-tap a photo for crop mode.</>}\n      </div>'''
          editor = replace_once(editor, old_hint, new_hint, 'compact editor guidance')

          # 6) The bottom quick-action row duplicates Media/Text/Layers in Photo Bootleg, so hide it there.
          editor = replace_once(
              editor,
              '      <div className="mt-3 border-t border-white/10 pt-3">',
              '      <div className={designPath === "bootleg" ? "hidden" : "mt-3 border-t border-white/10 pt-3"}>',
              'duplicate quick-action strip'
          )

          # 7) Let the Photo Bootleg garment occupy essentially the full desktop canvas.
          old_fill = 'fillCanvas ? "h-[86%] w-auto max-w-[94%] sm:h-[96%] sm:max-w-[98%]" : "h-[82%] w-auto max-w-[90%]"'
          new_fill = 'fillCanvas ? "h-[86%] w-auto max-w-[94%] sm:h-[96%] sm:max-w-[98%] lg:h-[103%] lg:max-w-[104%]" : "h-[82%] w-auto max-w-[90%]"'
          studio = replace_once(studio, old_fill, new_fill, 'desktop canvas fill')

          # Static regression guards for the requested behavior.
          required = [
              'event.key !== "Delete" && event.key !== "Backspace"',
              'Uploaded photos stay saved in Media.',
              'designPath !== "bootleg" && <button type="button" onClick={onDeletePhoto}',
              '["transform", Move, "Move / Size"]',
              'designPath === "bootleg" ? "hidden"',
          ]
          for token in required:
              if token not in editor:
                  raise SystemExit(f'missing expected editor token: {token}')
          if 'lg:h-[103%] lg:max-w-[104%]' not in studio:
              raise SystemExit('desktop fill guard missing')

          editor_path.write_text(editor)
          studio_path.write_text(studio)
          PY

      - name: Verify no active Base44 runtime dependency
        shell: bash
        run: |
          if grep -RniE 'base44Client|@base44/|@base44"|https://base44\.app|media\.base44\.com' src package.json vite.config.js; then
            echo "Active Base44 runtime reference detected."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression verification
        run: |
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          node scripts/verify-seasonal-artwork.mjs
          npm run build

      - name: Commit verified refinement and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git rm .github/workflows/one-shot-photo-bootleg-desktop-refinement.yml
          git add src/components/storefront/CustomStudioAdvancedEditor.jsx src/pages/CustomStudio.jsx
          git commit -m "Refine Photo Bootleg desktop editing and keyboard delete"
          git push origin HEAD:main
