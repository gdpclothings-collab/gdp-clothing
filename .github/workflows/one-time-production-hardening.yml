name: One-Time GDP Production Hardening Runner

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-time-production-hardening.yml"]

permissions:
  contents: write

jobs:
  finalize-hardening-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: hardening/production-flow-2026-09-12
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Align source with deployed gateway architecture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- supabase/functions/checkout/index.ts
          python3 - <<'PY'
          from pathlib import Path

          api = Path("src/lib/customerApi.js")
          text = api.read_text()

          track_start = text.index("  async trackCheckout(")
          create_start = text.index("  async createOrder(", track_start)
          confirm_start = text.index("  async getOrderConfirmation(", create_start)

          track_block = text[track_start:create_start]
          create_block = text[create_start:confirm_start]

          if 'supabase.functions.invoke("checkout"' not in track_block:
              raise SystemExit("trackCheckout invocation target not found")
          if 'supabase.functions.invoke("checkout"' not in create_block:
              raise SystemExit("createOrder invocation target not found")

          track_block = track_block.replace('supabase.functions.invoke("checkout"', 'supabase.functions.invoke("checkout-gateway"', 1)
          create_block = create_block.replace('supabase.functions.invoke("checkout"', 'supabase.functions.invoke("checkout-gateway"', 1)
          text = text[:track_start] + track_block + create_block + text[confirm_start:]
          api.write_text(text)

          verify = Path("scripts/verify-production-hardening.mjs")
          verify.write_text('''import fs from "node:fs";\nfunction text(path) { return fs.readFileSync(path, "utf8"); }\nfunction requireText(source, needle, label) {\n  if (!source.includes(needle)) throw new Error(`Missing hardening control: ${label}`);\n}\nconst gateway = text("supabase/functions/checkout-gateway/index.ts");\nconst webhook = text("supabase/functions/stripe-webhook/index.ts");\nconst maintenance = text("supabase/functions/maintenance-access/index.ts");\nconst api = text("src/lib/customerApi.js");\nconst page = text("src/pages/Checkout.jsx");\nconst headers = text("public/_headers");\nrequireText(gateway, 'consumeRateLimit(service, await sha256Hex(`checkout:create:ip:${clientIp(req)}`), 20, 600)', 'create-order IP rate limit');\nrequireText(gateway, 'consumeRateLimit(service, await sha256Hex(`checkout:create:email:${customerEmail}`), 8, 600)', 'create-order email rate limit');\nrequireText(gateway, 'consumeRateLimit(service, rateKey, 300, 3600)', 'checkout tracking rate limit');\nrequireText(gateway, 'service.rpc("claim_checkout_session"', 'atomic checkout claim');\nrequireText(gateway, '/functions/v1/checkout', 'authoritative checkout forwarding');\nrequireText(gateway, 'stripe_client_secret: data.clientSecret || null', 'checkout replay client secret persistence');\nrequireText(webhook, 'event.type === "checkout.session.expired"', 'expired checkout cleanup');\nrequireText(webhook, 'event.type === "checkout.session.async_payment_failed"', 'async payment failure cleanup');\nrequireText(webhook, 'resetUnpaidCustomOrderState(service, orderId)', 'custom design rollback');\nconst failedBlock = webhook.split('event.type === "payment_intent.payment_failed"')[1]?.split('event.type === "charge.refunded"')[0] || '';\nif (failedBlock.includes('releaseCheckoutReservations')) throw new Error('Retryable payment failure still releases reservations');\nrequireText(maintenance, 'p_limit: 10', 'maintenance password attempt limit');\nif ((api.match(/functions\.invoke\("checkout-gateway"/g) || []).length < 2) throw new Error('Storefront is not wired to checkout gateway');\nrequireText(page, 'const trackedCheckout = await customerApi.trackCheckout(', 'synchronous checkout tracking');\nrequireText(headers, 'https://fonts.googleapis.com', 'Google Fonts CSP');\nrequireText(headers, 'https://static.cloudflareinsights.com', 'Cloudflare Insights CSP');\nconsole.log('Production hardening controls verified.');\n''')
          PY
      - name: Verify final hardening branch
        run: |
          npm install --no-audit --no-fund
          node scripts/verify-production-hardening.mjs
          npm run typecheck
          npm run lint
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          node scripts/verify-seasonal-artwork.mjs
          node scripts/verify-photo-bootleg-desktop.mjs
          npm run build
      - name: Commit final hardening source
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize production checkout hardening" || true
          git push origin HEAD:hardening/production-flow-2026-09-12
