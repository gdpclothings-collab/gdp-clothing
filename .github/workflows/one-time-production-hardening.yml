name: One-Time GDP Production Hardening Runner

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-time-production-hardening.yml"]

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: hardening/production-flow-2026-09-12
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkout = Path("supabase/functions/checkout/index.ts")
          s = checkout.read_text()
          s = s.replace(
              "      await releaseCheckoutSessionClaim(service, checkoutSessionToken);\n      await releaseCheckoutSessionClaim(service, checkoutSessionToken);",
              "      await releaseCheckoutSessionClaim(service, checkoutSessionToken);"
          )
          s = s.replace(
              '    if (action === "trackCheckout") {\n      const user = await optionalUser(req, supabaseUrl, anonKey);\n      const incomingToken = String(body?.sessionToken || "").trim();',
              '    if (action === "trackCheckout") {\n      const user = await optionalUser(req, supabaseUrl, anonKey);\n      const trackRateKey = await sha256Hex(`checkout:track:ip:${clientIp(req)}`);\n      const trackRate = await consumePublicRateLimit(service, trackRateKey, 300, 3600);\n      if (!trackRate.allowed) {\n        const retryAfter = Math.max(1, Number(trackRate.retry_after || 60));\n        return respond(\n          req,\n          { error: true, retryable: true, rateLimited: true, message: "Checkout tracking is temporarily rate limited. Please try again shortly." },\n          429,\n          { "Retry-After": String(retryAfter) },\n        );\n      }\n      const incomingToken = String(body?.sessionToken || "").trim();'
          )
          s = s.replace(
              '        await service.from("orders").delete().eq("id", order.id);\n      await releaseCheckoutSessionClaim(service, checkoutSessionToken);',
              '        await service.from("orders").delete().eq("id", order.id);\n        await releaseCheckoutSessionClaim(service, checkoutSessionToken);'
          )
          checkout.write_text(s)

          page = Path("src/pages/Checkout.jsx")
          p = page.read_text()
          old = '''      setPlacing(true);\n      try {\n        const data = await customerApi.createOrder(\n          items,\n          checkoutForm,\n          checkoutForm.discountCode,\n          window.location.origin,\n          checkoutSessionToken\n        );'''
          new = '''      setPlacing(true);\n      try {\n        let orderSessionToken = checkoutSessionToken || crypto.randomUUID();\n        const trackedCheckout = await customerApi.trackCheckout(\n          items,\n          checkoutForm,\n          {\n            subtotal,\n            discount: discountAmt + couponAmt,\n            shipping,\n            tax,\n            total,\n          },\n          orderSessionToken\n        );\n        if (trackedCheckout?.sessionToken) {\n          orderSessionToken = trackedCheckout.sessionToken;\n          setCheckoutSessionToken(orderSessionToken);\n          try {\n            window.localStorage.setItem(checkoutStorageKey, orderSessionToken);\n          } catch {\n            // Checkout can continue for this page without local storage.\n          }\n        }\n\n        const data = await customerApi.createOrder(\n          items,\n          checkoutForm,\n          checkoutForm.discountCode,\n          window.location.origin,\n          orderSessionToken\n        );'''
          if old not in p:
              raise SystemExit("Checkout synchronous tracking patch target not found")
          p = p.replace(old, new, 1)
          page.write_text(p)
          PY
      - name: Add hardening verification
        run: |
          cat > scripts/verify-production-hardening.mjs <<'EOF'
          import fs from "node:fs";
          function text(path) { return fs.readFileSync(path, "utf8"); }
          function requireText(source, needle, label) {
            if (!source.includes(needle)) throw new Error(`Missing hardening control: ${label}`);
          }
          const checkout = text("supabase/functions/checkout/index.ts");
          const webhook = text("supabase/functions/stripe-webhook/index.ts");
          const maintenance = text("supabase/functions/maintenance-access/index.ts");
          const page = text("src/pages/Checkout.jsx");
          const headers = text("public/_headers");
          requireText(checkout, 'consumePublicRateLimit(service, ipRateKey, 20, 600)', 'create-order IP rate limit');
          requireText(checkout, 'consumePublicRateLimit(service, emailRateKey, 8, 600)', 'create-order email rate limit');
          requireText(checkout, 'consumePublicRateLimit(service, trackRateKey, 300, 3600)', 'checkout tracking rate limit');
          requireText(checkout, 'service.rpc(\n      "claim_checkout_session"', 'atomic checkout claim');
          requireText(checkout, '"Idempotency-Key": `gdp-checkout-${checkoutSessionToken}`', 'Stripe idempotency key');
          if ((checkout.match(/releaseCheckoutSessionClaim\(service, checkoutSessionToken\);\n\s*await releaseCheckoutSessionClaim/g) || []).length) {
            throw new Error('Duplicate checkout claim release detected');
          }
          requireText(webhook, 'event.type === "checkout.session.expired"', 'expired checkout cleanup');
          requireText(webhook, 'event.type === "checkout.session.async_payment_failed"', 'async payment failure cleanup');
          const failedBlock = webhook.split('event.type === "payment_intent.payment_failed"')[1]?.split('event.type === "charge.refunded"')[0] || '';
          if (failedBlock.includes('releaseCheckoutReservations')) throw new Error('Retryable payment failure still releases reservations');
          requireText(maintenance, 'p_limit: 10', 'maintenance password attempt limit');
          requireText(page, 'const trackedCheckout = await customerApi.trackCheckout(', 'synchronous checkout tracking');
          requireText(headers, 'https://fonts.googleapis.com', 'Google Fonts CSP');
          requireText(headers, 'https://static.cloudflareinsights.com', 'Cloudflare Insights CSP');
          console.log('Production hardening controls verified.');
          EOF
      - name: Install dependencies and verify
        run: |
          npm install --no-audit --no-fund
          node scripts/verify-production-hardening.mjs
          npm run typecheck
          npm run lint
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          node scripts/verify-seasonal-artwork.mjs
          node scripts/verify-photo-bootleg-desktop.mjs
          npm run build
      - name: Commit reviewed hardening branch
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Validate production checkout hardening"
          git push origin HEAD:hardening/production-flow-2026-09-12
