name: One-Time GDP Production Hardening Runner

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-time-production-hardening.yml"]

permissions:
  contents: read

jobs:
  deploy-edge-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mcmancxsqlhxnjhlnfkz
    steps:
      - name: Checkout verified hardening branch
        uses: actions/checkout@v5
        with:
          ref: hardening/production-flow-2026-09-12
      - name: Confirm Supabase deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions."
            exit 2
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy checkout hardening
        run: supabase functions deploy checkout --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy Stripe webhook hardening
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy maintenance access hardening
        run: supabase functions deploy maintenance-access --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
