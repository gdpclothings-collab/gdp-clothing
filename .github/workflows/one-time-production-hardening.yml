name: One-Time GDP Production Hardening Runner

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-time-production-hardening.yml"]

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v5
        with:
          ref: hardening/production-flow-2026-09-12
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Refine persisted checkout replay state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkout = Path("supabase/functions/checkout/index.ts")
          s = checkout.read_text()
          start = s.index("async function resumeConvertedCheckout(")
          end = s.index("function reservationErrorMessage", start)
          replacement = '''async function resumeConvertedCheckout(\n  service: any,\n  sessionToken: string,\n  orderId: string,\n) {\n  const [{ data: order, error: orderError }, { data: tracked, error: trackedError }] = await Promise.all([\n    service\n      .from("orders")\n      .select("id,order_number,confirmation_token,payment_mode,payment_status,subtotal,discount,shipping,tax,total,shipping_address")\n      .eq("id", orderId)\n      .maybeSingle(),\n    service\n      .from("checkout_sessions")\n      .select("stripe_client_secret,stripe_checkout_session_id")\n      .eq("session_token", sessionToken)\n      .eq("converted_order_id", orderId)\n      .maybeSingle(),\n  ]);\n\n  if (orderError) throw orderError;\n  if (trackedError) throw trackedError;\n  if (!order) {\n    return { status: 409, body: { error: true, retryable: true, message: "The previous checkout could not be found. Please try again." } };\n  }\n\n  if (order.payment_status === "paid") {\n    return {\n      status: 200,\n      body: {\n        paid: true,\n        orderNumber: order.order_number,\n        confirmationToken: order.confirmation_token,\n      },\n    };\n  }\n\n  const paymentMode = order.payment_mode === "test" ? "test" : "live";\n  const stripePublishableKey = Deno.env.get(paymentMode === "test" ? "STRIPE_TEST_PUBLISHABLE_KEY" : "STRIPE_PUBLISHABLE_KEY");\n  if (!stripePublishableKey || !tracked?.stripe_client_secret) {\n    return {\n      status: 409,\n      body: { error: true, retryable: true, message: "The previous secure payment session is not ready. Please try again." },\n    };\n  }\n\n  const taxRule = await getTaxRule(service, order.shipping_address?.province);\n  return {\n    status: 200,\n    body: {\n      orderNumber: order.order_number,\n      confirmationToken: order.confirmation_token,\n      clientSecret: tracked.stripe_client_secret,\n      publishableKey: stripePublishableKey,\n      configured: true,\n      paymentMode,\n      uiMode: "custom",\n      resumed: true,\n      pricing: {\n        subtotal: Number(order.subtotal || 0),\n        discount: Number(order.discount || 0),\n        shipping: Number(order.shipping || 0),\n        tax: Number(order.tax || 0),\n        total: Number(order.total || 0),\n        taxRate: Number(taxRule?.rate || 0),\n        taxName: taxRule?.name || "Tax",\n      },\n    },\n  };\n}\n\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace(
              '        const resumed = await resumeConvertedCheckout(service, String(checkoutClaim.converted_order_id));',
              '        const resumed = await resumeConvertedCheckout(\n          service,\n          checkoutSessionToken,\n          String(checkoutClaim.converted_order_id),\n        );'
          )
          old_success = '''    if (checkoutSessionToken) {\n      await service\n        .from("checkout_sessions")\n        .update({\n          status: "converted",\n          converted_order_id: order.id,\n          last_activity_at: new Date().toISOString(),\n        })\n        .eq("session_token", checkoutSessionToken);\n    }\n\n    return respond(req, {'''
          new_success = '''    if (checkoutSessionToken) {\n      await service\n        .from("checkout_sessions")\n        .update({\n          status: "converted",\n          converted_order_id: order.id,\n          stripe_checkout_session_id: stripeData.id,\n          stripe_client_secret: stripeData.client_secret,\n          processing_started_at: null,\n          last_activity_at: new Date().toISOString(),\n        })\n        .eq("session_token", checkoutSessionToken);\n    }\n\n    return respond(req, {'''
          if old_success not in s:
              raise SystemExit("Checkout success persistence target not found")
          s = s.replace(old_success, new_success, 1)

          old_missing = '''    if (!stripeSecret || !stripePublishableKey) {\n      await releaseCheckoutReservations(service, order.id);\n      await service\n        .from("orders")\n        .update({\n          payment_status: "failed",\n          status: "payment_failed",\n          fulfillment_status: "unfulfilled",\n        })\n        .eq("id", order.id);\n\n      if (checkoutSessionToken) {\n        await service\n          .from("checkout_sessions")\n          .update({\n            status: "converted",\n            converted_order_id: order.id,\n            last_activity_at: new Date().toISOString(),\n          })\n          .eq("session_token", checkoutSessionToken);\n      }\n\n      return respond(req, {\n        orderNumber: order.order_number,\n        confirmationToken: order.confirmation_token,\n        configured: false,'''
          new_missing = '''    if (!stripeSecret || !stripePublishableKey) {\n      await releaseCheckoutReservations(service, order.id);\n      await releaseGuestDesignClaims(service, order.id);\n      for (const design of uniqueDesigns as any[]) {\n        await service\n          .from("custom_designs")\n          .update({ order_id: null, status: "in_cart" })\n          .eq("id", design.id);\n      }\n      await service.from("design_proofs").delete().eq("order_id", order.id).eq("status", "pending");\n      await service.from("orders").delete().eq("id", order.id);\n      await releaseCheckoutSessionClaim(service, checkoutSessionToken);\n\n      return respond(req, {\n        configured: false,'''
          if old_missing not in s:
              raise SystemExit("Missing Stripe configuration rollback target not found")
          s = s.replace(old_missing, new_missing, 1)
          checkout.write_text(s)

          webhook = Path("supabase/functions/stripe-webhook/index.ts")
          w = webhook.read_text()
          w = w.replace(
              '''    .update({ status: "active", converted_order_id: null, last_activity_at: now })''',
              '''    .update({\n      status: "active",\n      converted_order_id: null,\n      stripe_checkout_session_id: null,\n      stripe_client_secret: null,\n      processing_started_at: null,\n      last_activity_at: now,\n    })'''
          )
          paid_anchor = '''        if (error) throw error;\n\n        if (matchedMode === "live" && productionReady && readyDesignIds.length) {'''
          paid_replace = '''        if (error) throw error;\n\n        const { error: checkoutCleanupError } = await service\n          .from("checkout_sessions")\n          .update({ stripe_client_secret: null, processing_started_at: null, last_activity_at: new Date().toISOString() })\n          .eq("converted_order_id", orderId);\n        if (checkoutCleanupError) console.error("checkout secret cleanup failed", checkoutCleanupError);\n\n        if (matchedMode === "live" && productionReady && readyDesignIds.length) {'''
          if paid_anchor not in w:
              raise SystemExit("Paid checkout cleanup anchor not found")
          w = w.replace(paid_anchor, paid_replace, 1)
          webhook.write_text(w)

          migration = Path("supabase/migrations/20260912215000_refine_checkout_claim_state.sql")
          migration.write_text('''-- Refine checkout replay state using existing checkout_sessions hardening columns.\n\ncreate or replace function public.claim_checkout_session(p_session_token uuid)\nreturns jsonb\nlanguage plpgsql\nset search_path to 'public'\nas $$\ndeclare\n  v_session public.checkout_sessions%rowtype;\n  v_started_at timestamptz;\nbegin\n  select * into v_session\n  from public.checkout_sessions\n  where session_token = p_session_token\n  for update;\n\n  if not found then\n    return jsonb_build_object('claimed', false, 'status', 'missing');\n  end if;\n\n  if v_session.expires_at is not null and v_session.expires_at <= now() then\n    update public.checkout_sessions\n    set status = 'expired', processing_started_at = null, last_activity_at = now()\n    where id = v_session.id;\n    return jsonb_build_object('claimed', false, 'status', 'expired');\n  end if;\n\n  if v_session.status = 'converted' then\n    return jsonb_build_object(\n      'claimed', false,\n      'status', 'converted',\n      'converted_order_id', v_session.converted_order_id\n    );\n  end if;\n\n  v_started_at := coalesce(v_session.processing_started_at, v_session.last_activity_at);\n  if v_session.status = 'processing' and v_started_at > now() - interval '10 minutes' then\n    return jsonb_build_object(\n      'claimed', false,\n      'status', 'processing',\n      'converted_order_id', v_session.converted_order_id\n    );\n  end if;\n\n  if v_session.status not in ('active', 'processing') then\n    return jsonb_build_object('claimed', false, 'status', v_session.status);\n  end if;\n\n  update public.checkout_sessions\n  set status = 'processing', processing_started_at = now(), last_activity_at = now()\n  where id = v_session.id;\n\n  return jsonb_build_object(\n    'claimed', true,\n    'status', 'processing',\n    'converted_order_id', v_session.converted_order_id\n  );\nend;\n$$;\n\ncreate or replace function public.release_checkout_session_claim(p_session_token uuid)\nreturns boolean\nlanguage plpgsql\nset search_path to 'public'\nas $$\ndeclare\n  v_count integer;\nbegin\n  update public.checkout_sessions\n  set status = 'active',\n      converted_order_id = null,\n      stripe_checkout_session_id = null,\n      stripe_client_secret = null,\n      processing_started_at = null,\n      last_activity_at = now()\n  where session_token = p_session_token\n    and status = 'processing';\n\n  get diagnostics v_count = row_count;\n  return v_count > 0;\nend;\n$$;\n\nrevoke execute on function public.claim_checkout_session(uuid) from public, anon, authenticated;\nrevoke execute on function public.release_checkout_session_claim(uuid) from public, anon, authenticated;\ngrant execute on function public.claim_checkout_session(uuid) to service_role;\ngrant execute on function public.release_checkout_session_claim(uuid) to service_role;\n''')
          PY
      - name: Extend hardening verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/verify-production-hardening.mjs")
          s = p.read_text()
          marker = "requireText(checkout, '\"Idempotency-Key\": `gdp-checkout-${checkoutSessionToken}`', 'Stripe idempotency key');"
          addition = marker + "\nrequireText(checkout, 'stripe_client_secret: stripeData.client_secret', 'persisted Stripe client secret');\nif (checkout.includes('https://api.stripe.com/v1/checkout/sessions/\" + encodeURIComponent')) throw new Error('Replay path still re-fetches Stripe Checkout Session');\nrequireText(webhook, 'stripe_client_secret: null', 'post-payment checkout secret cleanup');"
          if marker not in s:
              raise SystemExit("Hardening verification insertion target not found")
          p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Install dependencies and verify
        run: |
          npm install --no-audit --no-fund
          node scripts/verify-production-hardening.mjs
          npm run typecheck
          npm run lint
          npm run test:dtf-nesting
          npm run test:fresh-session
          npm run test:product-variants
          npm run test:memorial
          node scripts/verify-seasonal-artwork.mjs
          node scripts/verify-photo-bootleg-desktop.mjs
          npm run build
      - name: Commit replay hardening
        run: |
          git config user.name "gdpclothings-collab"
          git config user.email "gdpclothings@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Persist checkout replay state safely"
          git push origin HEAD:hardening/production-flow-2026-09-12
