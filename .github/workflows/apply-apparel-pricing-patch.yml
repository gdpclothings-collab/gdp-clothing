name: Apply Apparel Pricing Patch

on:
  push:
    branches:
      - feature/admin-apparel-pricing
    paths:
      - scripts/apply-apparel-pricing-patch.mjs
      - .github/workflows/apply-apparel-pricing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-apparel-pricing
          fetch-depth: 0

      - name: Apply deterministic pricing patch
        run: node scripts/apply-apparel-pricing-patch.mjs

      - name: Commit generated code changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cartPricing.js src/pages/CartV2.jsx src/pages/CustomStudioV2.jsx supabase/functions/checkout/index.ts
          git commit -m "Apply admin-managed apparel pricing engine"
          git push origin HEAD:feature/admin-apparel-pricing
