name: Apply Apparel Pricing Patch

on:
  push:
    branches:
      - feature/admin-apparel-pricing
    paths:
      - scripts/apply-apparel-pricing-patch.mjs
      - .github/workflows/apply-apparel-pricing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-apparel-pricing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic pricing patch
        run: node scripts/apply-apparel-pricing-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Verify pricing invariants
        shell: bash
        run: |
          grep -q 'apparel_pricing' supabase/functions/checkout/index.ts
          grep -q 'customQuoteMinQty' src/lib/cartPricing.js
          grep -q 'productType: product.type' src/pages/CustomStudioV2.jsx
          grep -q 'GDP bundle / volume pricing applied' src/pages/CartV2.jsx
          git diff --check
      - name: Commit generated code changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "gdp-clothing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/cartPricing.js src/pages/CartV2.jsx src/pages/CustomStudioV2.jsx supabase/functions/checkout/index.ts
          git commit -m "feat: apply admin-managed apparel pricing engine"
          git push origin HEAD:feature/admin-apparel-pricing
