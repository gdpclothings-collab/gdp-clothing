name: Run garment print guide repair

on:
  push:
    branches:
      - fix/garment-print-size-guides

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/garment-print-size-guides
          fetch-depth: 0

      - name: Apply targeted repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-print-guide-fix.yml').read_text()
          marker = '      - name: Apply targeted print-guide changes\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          block_start = source.index(run_marker, start) + len(run_marker)
          end_marker = '\n      - name: Verify targeted guide wiring\n'
          block_end = source.index(end_marker, block_start)
          block = source[block_start:block_end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-print-guide-fix.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-print-guide-fix.sh

      - name: Verify targeted guide wiring
        run: node scripts/verify-custom-studio-print-guides.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript
        run: npx eslint src/lib/customStudioV2PrintGuide.js src/pages/CustomStudioV2.jsx src/components/storefront/custom-studio-v2/SeasonalEditorV2.jsx src/components/storefront/custom-studio-v2/ProtectedTemplateEditorV2.jsx src/components/storefront/custom-studio-v2/UploadArtworkEditorV2.jsx scripts/verify-custom-studio-print-guides.mjs --quiet

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-print-guide-fix.yml .github/workflows/run-print-guide-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: calibrate garment print size guides"
          git push origin HEAD:fix/garment-print-size-guides
