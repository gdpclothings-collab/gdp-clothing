name: Fix Memorial Typography Integration

on:
  push:
    branches:
      - codex/memorial-typography-editor
    paths:
      - .github/workflows/fix-memorial-typography.yml
      - scripts/fix-memorial-typography-integration.mjs

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply corrections
        run: node scripts/fix-memorial-typography-integration.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Memorial regression test
        run: npm run test:memorial

      - name: Production build
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Commit corrected source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction changes to commit."
            exit 0
          fi
          git config user.name "gdp-clothing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/CustomStudio.jsx src/components/storefront/MemorialTypographyEditor.jsx
          git commit -m "fix: harden Memorial typography preview and types"
          git push origin HEAD:codex/memorial-typography-editor
