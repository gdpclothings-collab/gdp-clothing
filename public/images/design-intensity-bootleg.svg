  <text x="290" y="998" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Fully loaded bootleg look</text>
  <text x="290" y="1029" fill="#c8c8c8" font-family="Arial, Helvetica, sans-serif" font-size="19">with dense collage energy.</text>
