    <circle cx="752" cy="899" r="5" fill="#111" stroke="#aaa"/>
    <circle cx="816" cy="899" r="5" fill="#111" stroke="#aaa"/>
    <path d="M837 820l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f0d77c" filter="url(#glow)"/>
    <text x="814" y="873" fill="#f0d77c" font-family="Georgia, serif" font-size="9" font-style="italic">Dreams</text>
    <text x="809" y="883" fill="#f0d77c" font-family="Georgia, serif" font-size="9" font-style="italic">Don't Die</text>
  </g>

  <!-- ROW 5 -->
  <g filter="url(#shadow)">
