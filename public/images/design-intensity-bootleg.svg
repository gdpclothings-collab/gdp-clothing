<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" role="img" aria-labelledby="title desc">
  <title id="title">Design Intensity Guide</title>
  <desc id="desc">Five bootleg rap apparel design examples from clean to maximum chaos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset=".5" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#f1d98a"/>
      <stop offset=".55" stop-color="#c99c3e"/>
      <stop offset="1" stop-color="#f5e7ab"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset=".28" stop-color="#777"/>
      <stop offset=".52" stop-color="#fff"/>
      <stop offset=".75" stop-color="#666"/>
      <stop offset="1" stop-color="#ddd"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" x2="1"><stop stop-color="#3a3a3a"/><stop offset="1" stop-color="#242424"/></linearGradient>
    <linearGradient id="r2" x1="0" x2="1"><stop stop-color="#27384d"/><stop offset="1" stop-color="#1d2836"/></linearGradient>
    <linearGradient id="r3" x1="0" x2="1"><stop stop-color="#545337"/><stop offset="1" stop-color="#343323"/></linearGradient>
    <linearGradient id="r4" x1="0" x2="1"><stop stop-color="#6a3733"/><stop offset="1" stop-color="#442521"/></linearGradient>
    <linearGradient id="r5" x1="0" x2="1"><stop stop-color="#4e345d"/><stop offset="1" stop-color="#2d2038"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".6" fill="#fff" opacity=".08"/>
      <circle cx="6" cy="5" r=".5" fill="#fff" opacity=".05"/>
      <circle cx="3" cy="7" r=".4" fill="#fff" opacity=".04"/>
    </pattern>
    <clipPath id="tee1"><path d="M720 205 758 187h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z"/></clipPath>
    <clipPath id="tee2"><path d="M720 400 758 382h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z"/></clipPath>
    <clipPath id="tee3"><path d="M720 595 758 577h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z"/></clipPath>
    <clipPath id="tee4"><path d="M720 790 758 772h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z"/></clipPath>
    <clipPath id="tee5"><path d="M720 985 758 967h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z"/></clipPath>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg)"/>
  <rect width="1000" height="1250" fill="url(#grain)"/>
  <path d="M0 0h165l-54 1250H0z" fill="#0a0a0a" opacity=".75"/>
  <path d="M1000 0H900l48 1250h52z" fill="#090909" opacity=".8"/>

  <text x="185" y="73" fill="#f2f2f2" font-family="Impact, Arial Black, sans-serif" font-size="72" letter-spacing="-2">DESIGN INTENSITY</text>
  <text x="709" y="72" fill="url(#gold)" font-family="Georgia, serif" font-size="64" font-weight="700" font-style="italic">Guide</text>
  <text x="188" y="113" fill="#cfcfcf" font-family="Arial, Helvetica, sans-serif" font-size="24">How detailed do you want your design?</text>
  <text x="70" y="110" fill="#c9a758" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">GDP CLOTHING</text>

