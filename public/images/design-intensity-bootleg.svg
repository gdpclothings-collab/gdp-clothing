    <text x="742" y="499" fill="#aaa" font-family="Arial, sans-serif" font-size="6" font-weight="700">PEOPLE</text>
    <text x="742" y="507" fill="#aaa" font-family="Arial, sans-serif" font-size="6" font-weight="700">PLACES</text>
