  </g>
  <text x="102" y="232" fill="#f0f0f0" font-family="Impact, Arial Black, sans-serif" font-size="70">1<tspan font-size="34">/5</tspan></text>
  <line x1="103" y1="249" x2="214" y2="249" stroke="#aaa" opacity=".6"/>
  <text x="103" y="283" fill="#fff" font-family="Impact, Arial Black, sans-serif" font-size="27" letter-spacing="1">CLEAN</text>
  <text x="290" y="218" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Minimal, simple layout</text>
  <text x="290" y="249" fill="#c8c8c8" font-family="Arial, Helvetica, sans-serif" font-size="19">with lots of breathing room.</text>
  <path d="M720 205 758 187h48l38 18 36 38-35 24-17-18v81H736v-81l-17 18-35-24z" fill="#0b0b0b" stroke="#454545"/>
  <g clip-path="url(#tee1)">
    <circle cx="783" cy="244" r="23" fill="#d4d4d4"/>
    <path d="M762 245q21-34 42 0v30h-42z" fill="#686868"/>
    <text x="783" y="296" text-anchor="middle" fill="#f2f2f2" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2">KING NOVA</text>
    <text x="783" y="312" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="7" letter-spacing="2">A HIGHER VISION</text>
  </g>

  <!-- ROW 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="350" width="860" height="170" rx="20" fill="#151515" stroke="#3a3a3a"/>
    <path d="M70 370q0-20 20-20h165v170H90q-20 0-20-20z" fill="url(#r2)"/>
  </g>
  <text x="102" y="427" fill="#f0f0f0" font-family="Impact, Arial Black, sans-serif" font-size="70">2<tspan font-size="34">/5</tspan></text>
  <line x1="103" y1="444" x2="214" y2="444" stroke="#9db5d2" opacity=".7"/>
