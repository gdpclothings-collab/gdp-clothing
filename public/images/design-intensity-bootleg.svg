    <text x="784" y="1009" text-anchor="middle" fill="url(#chrome)" font-family="Impact, Arial Black, sans-serif" font-size="19" letter-spacing=".8">KING NOVA</text>
    <path d="M740 1095h83l8 11h-99z" fill="#1d2732" stroke="#d8d8d8" stroke-width=".8"/>
