<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">GDP Clothing custom DTF gang sheet</title>
  <desc id="desc">A wide format DTF transfer film roll with arranged artwork tiles.</desc>
  <rect width="1200" height="1500" fill="#eeeae0"/>
  <rect x="92" y="92" width="1016" height="1316" rx="28" fill="#111"/>
  <text x="150" y="190" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" letter-spacing="8">GDP CLOTHING</text>
  <text x="150" y="258" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900">DTF GANG SHEET</text>
  <text x="150" y="315" fill="#a9a9a9" font-family="Arial,Helvetica,sans-serif" font-size="28" letter-spacing="3">UP TO 34&quot; WIDE · CUSTOM LENGTH</text>
  <g transform="translate(180 395)">
    <rect x="0" y="0" width="840" height="780" rx="20" fill="#f8f8f5"/>
    <g stroke="#d8d8d2" stroke-width="2">
      <path d="M0 130H840M0 260H840M0 390H840M0 520H840M0 650H840"/>
      <path d="M140 0V780M280 0V780M420 0V780M560 0V780M700 0V780"/>
    </g>
    <rect x="38" y="42" width="235" height="180" rx="14" fill="#151515"/>
    <text x="156" y="122" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">LOGO</text>
    <text x="156" y="165" text-anchor="middle" fill="#bbb" font-family="Arial,Helvetica,sans-serif" font-size="18">10 × 8 IN</text>
    <rect x="302" y="42" width="500" height="180" rx="14" fill="#e11d2e"/>
    <text x="552" y="120" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">OVERSIZED PRINT</text>
    <text x="552" y="165" text-anchor="middle" fill="#ffd8dc" font-family="Arial,Helvetica,sans-serif" font-size="18">21 × 8 IN</text>
    <rect x="38" y="252" width="360" height="250" rx="14" fill="#ddd9ce"/>
    <circle cx="218" cy="352" r="64" fill="#111"/>
    <path d="M176 409c25-47 59-70 102-70" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <text x="218" y="470" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">ARTWORK 01</text>
    <rect x="430" y="252" width="372" height="250" rx="14" fill="#222"/>
    <text x="616" y="360" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">ARTWORK 02</text>
    <text x="616" y="405" text-anchor="middle" fill="#999" font-family="Arial,Helvetica,sans-serif" font-size="18">HIGH RESOLUTION</text>
    <rect x="38" y="535" width="235" height="190" rx="14" fill="#e11d2e"/>
    <text x="156" y="635" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">PATCH</text>
    <rect x="302" y="535" width="235" height="190" rx="14" fill="#111"/>
    <text x="420" y="635" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">CHEST</text>
    <rect x="566" y="535" width="236" height="190" rx="14" fill="#ddd9ce"/>
    <text x="684" y="635" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">BACK</text>
  </g>
  <g transform="translate(150 1235)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="0" fill="#fff" font-size="24" font-weight="700" letter-spacing="2">BUILD · UPLOAD · PREVIEW · PRINT</text>
    <text x="0" y="58" fill="#9c9c9c" font-size="20">TRANSFER FILM ONLY · GARMENT NOT INCLUDED</text>
  </g>
