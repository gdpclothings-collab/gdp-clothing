<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="GDP Clothing streetwear hero">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#060606"/>
      <stop offset="0.55" stop-color="#171717"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- graffiti wall texture -->
  <g opacity=".18" fill="none" stroke="#d8d8d8" stroke-width="10">
    <path d="M80 180 C220 80 330 260 470 140 S720 110 870 240"/>
    <path d="M980 130 l220 80 -120 110 260 45"/>
    <path d="M110 640 q220-120 410 20 t420-20"/>
    <path d="M1040 680 q160-100 360-10"/>
  </g>
  <g opacity=".12" fill="#fff">
    <rect x="120" y="100" width="180" height="38" transform="rotate(-11 120 100)"/>
    <rect x="1120" y="150" width="210" height="28" transform="rotate(8 1120 150)"/>
    <rect x="1020" y="560" width="260" height="34" transform="rotate(-7 1020 560)"/>
  </g>

  <!-- back-view streetwear figure -->
  <g transform="translate(760 50)">
    <ellipse cx="300" cy="175" rx="115" ry="125" fill="#141414"/>
    <rect x="222" y="235" width="156" height="72" rx="20" fill="#111"/>
    <path d="M95 315 Q300 250 505 315 L575 745 Q300 835 25 745 Z" fill="url(#shirt)"/>
    <path d="M112 340 Q30 430 15 690" fill="none" stroke="#171717" stroke-width="95" stroke-linecap="round"/>
    <path d="M488 340 Q570 430 585 690" fill="none" stroke="#171717" stroke-width="95" stroke-linecap="round"/>
    <path d="M184 300 Q300 345 416 300" fill="none" stroke="#2a2a2a" stroke-width="10"/>

    <!-- shirt print -->
    <g text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900">
      <text x="300" y="430" fill="#f2f2f2" font-size="62" transform="rotate(-2 300 430)">GOOD</text>
      <text x="300" y="500" fill="#f2f2f2" font-size="64" transform="rotate(1 300 500)">PEOPLE</text>
      <text x="300" y="570" fill="#f2f2f2" font-size="60" transform="rotate(-1 300 570)">DOPE</text>
      <text x="300" y="642" fill="#f2f2f2" font-size="62" transform="rotate(2 300 642)">CLOTHES</text>
      <rect x="205" y="675" width="190" height="18" rx="9" fill="#e11d2e" transform="rotate(-4 205 675)"/>
    </g>
  </g>

  <ellipse cx="1160" cy="830" rx="360" ry="45" fill="#000" opacity=".35" filter="url(#soft)"/>
</svg>